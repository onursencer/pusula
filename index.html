<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pusula Çocuk Gündemi</title>

<style>
/* Layout: gazete masası — üstte pusula başlığı, solda günün haberi, sağda akış; her haber aynı iskelet (ne oldu / neden önemli / bize ne / kelime / soru) */
:root{--paper:#D9F3F0;--surface:#FFFFFF;--ink:#0F2A2E;--muted:#4F6A6D;--line:#B9E0DC;--sun:#FFC93C;--sun-ink:#0F2A2E;--tr:#D6455D;--tr-soft:#FCE7EB;--world:#1F6FB2;--world-soft:#E2EEF8;--lead:#08858A;--lead-fg:#FFFFFF;--lead-accent:#FFD45C;--focus:#08858A;color-scheme:light;--f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;--f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;--s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s5:1.5rem;--s6:2rem;--s7:3rem;--r:14px}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:var(--s4);padding-block:var(--s3)}
.logo{display:flex;align-items:center;gap:var(--s2);text-decoration:none}
.logo svg{width:38px;height:38px;flex:none}
.logo b{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em}
.logo small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1}
.date{margin-left:auto;font-size:.85rem;color:var(--muted);text-align:right}
nav{overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav ul{display:flex;gap:var(--s1);list-style:none;margin:0;padding:0 0 var(--s2);white-space:nowrap}
nav a{display:block;text-decoration:none;padding:.4rem .85rem;border-radius:999px;font-weight:700;font-size:.95rem;color:var(--muted)}
nav a:hover{color:var(--ink);background:var(--paper)}
nav a[aria-current="page"]{background:var(--lead);color:var(--lead-fg)}

main{padding-block:var(--s6) var(--s7)}
.proto{font-size:.85rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:.5rem .8rem;margin-bottom:var(--s5)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .6rem;border-radius:999px}
.chip.turkiye{background:var(--tr-soft);color:var(--tr)}
.chip.dunya{background:var(--world-soft);color:var(--world)}
.chip.konu{background:transparent;color:var(--muted);padding-inline:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);font-size:.85rem;color:var(--muted)}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:var(--s6);align-items:start}
.lead{background:var(--lead);color:var(--lead-fg);border-radius:22px;padding:var(--s6);position:relative;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;gap:var(--s4)}
.lead .rose{position:absolute;right:-60px;top:-60px;width:260px;height:260px;opacity:.13;pointer-events:none}
.lead .eyebrow{font-family:var(--f-display);font-weight:700;color:var(--lead-accent);letter-spacing:.08em;text-transform:uppercase;font-size:.85rem}
.lead h1{font-size:clamp(2rem,4.5vw,3.1rem);font-weight:800;letter-spacing:-.02em;max-width:18ch}
.lead p{font-size:1.1rem;max-width:52ch;opacity:.92}
.lead .go{align-self:flex-start;background:var(--lead-accent);color:#14213D;font-weight:700;padding:.55rem 1.1rem;border-radius:999px}
.lead:hover .go{transform:translateX(3px)}
.go{transition:transform .2s}
.side h2,.sec-title{font-size:1.35rem;font-weight:800;margin-bottom:var(--s4);display:flex;align-items:baseline;gap:var(--s2)}
.sec-title small{font-family:var(--f-body);font-weight:400;font-size:.9rem;color:var(--muted)}

.feed{display:flex;flex-direction:column;gap:var(--s3)}
.item{display:grid;grid-template-columns:6px minmax(0,1fr);gap:var(--s3);text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4)}
.item:hover{border-color:var(--muted)}
.item .stripe{border-radius:6px}
.item.turkiye .stripe{background:var(--tr)} .item.dunya .stripe{background:var(--world)}
.item h3{font-size:1.12rem;font-weight:700;margin-block:.3rem .25rem}
.item p{font-size:.95rem;color:var(--muted)}

.row{margin-top:var(--s7)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--s4)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);text-decoration:none;display:flex;flex-direction:column;gap:var(--s2)}
.card:hover{border-color:var(--muted)}
.card h3{font-size:1.15rem;font-weight:700}
.card p{color:var(--muted);font-size:.95rem}
.card .count{margin-top:auto;font-size:.85rem;font-weight:700;color:var(--ink)}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--s4)}
.qbox{background:var(--sun);color:var(--sun-ink);border-radius:var(--r);padding:var(--s5);text-decoration:none;display:flex;flex-direction:column;gap:var(--s2)}
.qbox h3{font-size:1.25rem;font-weight:800}
.qbox.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

/* article */
.article{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s5)}
.back{font-weight:700;text-decoration:none;color:var(--muted);font-size:.95rem}
.back:hover{color:var(--ink)}
.article h1{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:800;letter-spacing:-.015em}
.article .ozet{font-size:1.2rem;color:var(--muted)}
.block h2{font-size:1.25rem;font-weight:800;margin-bottom:var(--s2)}
.block p+p{margin-top:var(--s3)}
.box{border-radius:var(--r);padding:var(--s5)}
.box.why{background:var(--surface);border:1px solid var(--line)}
.box.us{background:var(--world-soft)}
.box.us h2{color:var(--world)}
.box.ask{background:var(--sun);color:var(--sun-ink)}
.box.limit{background:var(--surface);border:2px dashed var(--lead)}
.box.limit h2{color:var(--lead)}
.words{display:flex;flex-wrap:wrap;gap:var(--s2)}
.word{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.35rem .7rem;font-weight:700;text-decoration:none;font-size:.95rem}
.word:hover{border-color:var(--ink)}
.where{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s4);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) var(--s5)}
.where svg{width:64px;height:64px}
.where b{font-family:var(--f-display);font-size:1.15rem}
.where .nums{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem}
.src{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:var(--s3)}

/* sözlük */
.search{width:100%;max-width:420px;font:inherit;padding:.65rem .9rem;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:var(--s5)}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s3)}
.term{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) var(--s5)}
.term h3{font-size:1.1rem;font-weight:800;margin-bottom:.2rem}
.term p{font-size:.95rem}
.term .rel{font-size:.82rem;color:var(--muted);margin-top:var(--s2)}
.term:target{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}

/* sorular */
.qa{display:flex;flex-direction:column;gap:var(--s3);max-width:760px}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) var(--s5)}
summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.1rem;list-style:none;display:flex;gap:var(--s3);justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--muted)}
details[open] summary::after{content:"−"}
details .who{font-size:.85rem;color:var(--muted);margin-top:var(--s1)}
details .ans{margin-top:var(--s3)}
form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);max-width:760px;margin-top:var(--s6)}
label{font-weight:700;font-size:.95rem}
input[type=text],select,textarea{font:inherit;width:100%;padding:.6rem .8rem;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--s3)}
.check{display:flex;gap:var(--s2);align-items:flex-start;font-weight:400}
.check input{margin-top:.35rem}
.btn{align-self:flex-start;font:inherit;font-weight:700;border:0;border-radius:999px;padding:.6rem 1.3rem;background:var(--ink);color:var(--surface);cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:.92rem;padding:.6rem .8rem;border-radius:10px;background:var(--world-soft);color:var(--ink)}

/* quiz */
.quiz{max-width:640px;display:flex;flex-direction:column;gap:var(--s4)}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.progress i.ok{background:var(--world)} .progress i.no{background:var(--tr)} .progress i.now{background:var(--sun)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.qcard h2{font-size:1.35rem;font-weight:800}
.opt{font:inherit;text-align:left;padding:.75rem 1rem;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--world);background:var(--world-soft)}
.opt.wrong{border-color:var(--tr);background:var(--tr-soft)}
.opt:disabled{cursor:default}
.expl{font-size:.95rem;color:var(--muted)}
.score{font-family:var(--f-display);font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums}

/* ilkeler */
.rules{max-width:760px;display:flex;flex-direction:column;gap:var(--s4);counter-reset:r}
.rule{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:var(--s3)}
.rule::before{counter-increment:r;content:counter(r);font-family:var(--f-display);font-weight:800;font-size:1.3rem;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center}
.rule h3{font-size:1.1rem;font-weight:800;margin-bottom:.15rem}
.rule p{color:var(--muted)}

.intro{max-width:62ch;color:var(--muted);margin-bottom:var(--s5);font-size:1.05rem}
.page-h{font-size:clamp(1.8rem,4vw,2.4rem);font-weight:800;margin-bottom:var(--s2)}

footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-block:var(--s5);display:flex;flex-wrap:wrap;gap:var(--s3) var(--s6);font-size:.88rem;color:var(--muted)}
footer b{color:var(--ink);font-family:var(--f-display)}

/* kavram bağlantıları ve kart */
.k{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-bottom:2px dotted var(--lead);text-align:inherit;line-height:inherit}
.k:hover{background:var(--paper);border-bottom-style:solid}
.word.k{border:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:700}
.word.k:hover{border-color:var(--lead);background:var(--surface)}
#kart{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 32px));max-height:min(78vh,640px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(15,42,46,.22);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
#kart .top{display:flex;align-items:flex-start;gap:var(--s3)}
#kart .tur{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lead)}
#kart h2{font-size:1.45rem;font-weight:800}
#kart .x{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:1.2rem;line-height:1;cursor:pointer}
#kart dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.25rem var(--s4);margin:0;font-size:.95rem;background:var(--paper);border-radius:12px;padding:var(--s3) var(--s4)}
#kart dt{color:var(--muted)} #kart dd{margin:0;font-weight:700}
#kart .map{height:170px;border-radius:12px;background:var(--world-soft);overflow:hidden}
#kart .rel{font-size:.9rem;color:var(--muted)}
#kart .rel a{color:var(--ink)}
#kart .more{font-size:.9rem;font-weight:700;color:var(--lead)}
.jvm-container{position:relative;overflow:hidden;height:100%;width:100%;touch-action:none}
.jvm-tooltip{display:none!important}
/* arama */
.find{margin-left:var(--s4);flex:0 1 260px;min-width:0}
.find input{width:100%;font:inherit;font-size:.95rem;padding:.5rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.res h2{font-size:1.2rem;font-weight:800;margin:var(--s5) 0 var(--s3)}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) var(--s5);text-align:left;font:inherit;color:inherit;width:100%;cursor:pointer;display:block}
.hit:hover{border-color:var(--lead)}
.hit b{font-family:var(--f-display);font-size:1.1rem}
.hit small{display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lead)}
.hit span{display:block;color:var(--muted);font-size:.95rem}
.term .tur{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lead)}
.term button.k{border:0;font-family:var(--f-display);font-weight:800;font-size:1.1rem;text-align:left}
.tip{font-size:.9rem;color:var(--muted)}

@media (max-width:820px){
  .home{grid-template-columns:minmax(0,1fr)}
  .lead{padding:var(--s5)}
  .two{grid-template-columns:minmax(0,1fr)}
  .date{display:none}
  .find{margin-left:auto;flex-basis:170px}
  #kart{right:0;left:0;bottom:0;width:100%;max-height:72vh;border-radius:18px 18px 0 0;padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom,0px));padding-left:max(var(--s5),env(safe-area-inset-left,0px));padding-right:max(var(--s5),env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  <div class="wrap">

        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--lead)"/><circle cx="20" cy="20" r="14" fill="none" stroke="var(--surface)" stroke-width="1.2" opacity=".5"/><path d="M20 5 L24 20 L20 35 L16 20 Z" fill="var(--surface)"/><path d="M20 5 L24 20 L16 20 Z" fill="var(--sun)"/><circle cx="20" cy="20" r="2.2" fill="var(--lead)"/></svg>

</footer>

<script>
const IST = {lat:41.01, lon:28.98};

const GUNCELLEME = "22 Kasım 2026";

const NAV = [
  ["ana","Ana sayfa"],["turkiye","Türkiye"],["dunya","Dünya"],["dosyalar","Dosyalar"],
  ["sozluk","Sözlük"],["quiz","Haftanın Quizi"],["ilkeler","İlkelerimiz"]
];

 {"id": "ucluzirve", "bolum": "dunya", "konu": "Siyaset", "sure": 3, "seviye": "10+", "dosya": null, "tarih": "22 Kasım 2026", "yer": {"ad": "Shenzhen, Çin", "lat": 22.54, "lon": 114.06}, "baslik": "ABD, Çin ve Rusya liderleri ilk kez üçlü masada: Konu nükleer silahlar", "ozet": "ABD, Çin ve Rusya'nın liderleri 19 Kasım'da Çin'in Shenzhen kentinde ilk kez üçü bir arada görüştü. Nükleer riskleri azaltmak için konuşmaya devam etme sözü verdiler ama somut bir anlaşma çıkmadı.", "neOldu": ["Görüşme, Asya ve Pasifik ülkelerinin ekonomi toplantısı APEC sırasında yapıldı. ABD Başkanı Donald Trump, Çin Devlet Başkanı Şi Cinping ve Rusya Devlet Başkanı Vladimir Putin ilk kez üçlü bir toplantıda bir araya geldi. Dünyadaki nükleer silahların büyük bölümü bu üç ülkenin elinde.", "Toplantının ardından ortak bir bildiri yayımlandı. Liderler, nükleer silahların başka ülkelere yayılmasını önlemek ve nükleer riskleri azaltmak için görüşmeler yapacaklarını açıkladı. Bildiride Birleşmiş Milletler'de reform yapılması ve petrol ürünlerinin düzenli akması gibi konular da yer aldı.", "Ancak silahların sayısı ya da nasıl denetleneceği gibi konularda bir anlaşma yapılmadı. ABD ile Rusya arasındaki son büyük nükleer silah anlaşması olan New START, bu yılın şubat ayında sona ermişti."], "neden": "Nükleer silahlar çok güçlü ve tehlikeli silahlar. Ülkeler onların sayısını sınırlamak ve kazara kullanılmalarını önlemek için yıllardır anlaşmalar yapıyor. Bu tür görüşmeler, dünyanın daha güvenli olması için atılan adımların bir parçası.", "taraflar": "Beyaz Saray'ın açıklamasına göre üç lider, nükleer bir savaşın kazanılamayacağını ve asla yapılmaması gerektiğini yeniden vurguladı. Çin Devlet Başkanı Şi, toplantıdan önce nükleer silahların tamamen yasaklanıp yok edilmesi gerektiğini söyledi ve görüşmeyi olumlu buldu. Rusya Devlet Başkanı Putin ise üçlü toplantıyı yararlı ve içerikli olarak nitelendirdi. Silah kontrolü üzerine çalışan bazı uzmanlar, tek bir toplantıdan büyük bir sonuç beklenmemesi gerektiğini belirtti.", "bizeNe": "Türkiye, nükleer silahların yayılmasını önlemeyi amaçlayan uluslararası anlaşmaya taraf olan ülkelerden biri. Büyük güçler arasındaki anlaşmalar, Türkiye'nin de içinde bulunduğu bölgenin güvenliğini etkiliyor.", "kelimeler": ["nukleer", "apec", "abd", "cin", "rusya", "bm"], "soru": "Bir anlaşmazlığı çözmek için herkesin bir masada oturup konuşması sence neden önemli? İlk görüşmeden sonuç çıkmazsa ne yapılmalı?", "kaynaklar": [["AP (Alaska's News Source), 19 Kasım 2026", "https://www.alaskasnewssource.com/2026/11/19/nuclear-arms-ending-wars-iran-ukraine-top-agenda-trump-xi-putin-meeting/"], ["Al Jazeera, 19 Kasım 2026", "https://aljazeera.com/news/2026/11/19/groundbreaking-trump-xi-putin-summit-five-key-takeaways"], ["RFA, 19 Kasım 2026", "https://rfa.org/english/china/2026/11/19/trump-xi-putin-apec-summit/"], ["Çin Dışişleri Bakanlığı: APEC Liderler Toplantısı", "https://www.mfa.gov.cn/eng/xw/zyxw/202611/t20261119_12063183.html"]]},
 {"id": "paramasa", "bolum": "turkiye", "konu": "Spor", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "yer": {"ad": "Pattaya, Tayland", "lat": 12.93, "lon": 100.88}, "baslik": "Para masa tenisinde dünya şampiyonu: Abdullah Öztürk finalde set vermedi", "ozet": "Tayland'da yapılan Dünya Para Masa Tenisi Şampiyonası'nda milli sporcu Abdullah Öztürk altın madalya kazandı. Türkiye şampiyonayı 3 altın ve 3 bronz madalyayla tamamladı.", "neOldu": ["Şampiyona Tayland'ın Pattaya kentinde yapıldı. Trabzonlu sporcu Abdullah Öztürk, 19 Kasım'daki tekler finalinde Tayvanlı rakibi Ming Chih Cheng'i 3-0 yendi. Yarı finalde ise Almanyalı Valentin Baus'la çok çekişmeli bir maç oynamış, beşinci ve son seti 13-11 kazanarak finale yükselmişti.", "Kadınlarda da milli sporcu Ebru Acer kendi sınıfında altın madalyanın sahibi oldu. Türkiye şampiyonadan toplam 6 madalyayla döndü."], "neden": "Para sporlarda sporcular, engellerinin türüne ve derecesine göre sınıflara ayrılarak yarışıyor; böylece benzer durumdaki sporcular birbiriyle karşılaşıyor. Abdullah Öztürk daha önce 2016 Rio ve 2020 Tokyo Paralimpik Oyunları'nda da altın madalya kazanmıştı.", "kelimeler": ["paraspor", "paralimpik", "tayland"], "soru": "Bir maçta ya da oyunda geride kaldığın bir anı düşün. Pes etmemek için kendine ne söylerdin?", "kaynaklar": [["Haberkenti", "https://www.haberkenti.com/abdullah-ozturk-dunya-sampiyonu-finalde-3-0-kazandi"], ["Yeniçağ", "https://www.yenicaggazetesi.com/dunya-para-masa-tenisi-sampiyonasinda-abdullah-ozturk-ve-ebru-acer-altin-madalya-kazandi-1092211h.htm"], ["Ajansspor", "https://ajansspor.com/haber/abdullah-ozturk-dunya-sampiyonu-oldu-738946"]]},
 {"id": "sosyalmedya15", "bolum": "turkiye", "konu": "Teknoloji", "sure": 3, "seviye": "10+", "dosya": null, "tarih": "22 Kasım 2026", "baslik": "Sosyal medyada yeni dönem: 15 yaşından küçükler hesap açamıyor", "ozet": "1 Kasım'dan beri Türkiye'de sosyal medya hesabı açarken yaş doğrulaması zorunlu. 15 yaşından küçükler kendi hesaplarını açamıyor, eski hesaplar da Mart 2027'ye kadar kontrol edilecek.", "neOldu": ["Bu kurallar, Nisan 2026'da Meclis'te kabul edilen bir yasayla geldi. Yasanın nasıl uygulanacağını anlatan yönetmelik ekim ayında yayımlandı ve kurallar 1 Kasım'da yürürlüğe girdi.", "Yeni bir hesap açılırken kullanıcının yaşı e-Devlet üzerinden doğrulanıyor. Daha önce açılmış hesaplar için de sosyal medya şirketlerinin 31 Mart 2027'ye kadar yaş doğrulaması yapması gerekiyor. Yaşı 15'ten küçük çıkan kullanıcıların hesapları kapatılacak.", "Kurallara uyma sorumluluğu çocuklarda ya da ailelerde değil, sosyal medya şirketlerinde. Kurallara uymayan şirketlere yaptırım uygulanabilecek."], "neden": "Bu düzenleme doğrudan senin yaşındaki çocukları ilgilendiriyor. Avustralya gibi başka ülkeler de son yıllarda çocukların sosyal medya kullanımına yaş sınırı getirdi.", "taraflar": "Düzenlemeyi destekleyenler arasında Yeşilay gibi kuruluşlar var. Onlara göre bu kurallar çocukları zararlı içeriklerden ve tanımadıkları kişilerden korumaya yardım edecek, şirketler de daha güvenli uygulamalar tasarlamak zorunda kalacak. Eleştirenler arasında ise dijital haklar alanında çalışan dernekler ve bazı eğitimciler var. Onlara göre kimlik bilgisini hesapla eşleştirmek kişisel verilerin güvenliği konusunda soru işaretleri doğuruyor ve yasak tek başına çözüm değil.", "kelimeler": ["sosyalmedya", "edevlet", "meclis", "yonetmelik", "avustralya"], "soru": "Sence çocuklar interneti güvenle kullanmak için neleri bilmeli? Bir arkadaşına üç tavsiye verecek olsan bunlar ne olurdu?", "kaynaklar": [["Yeni Asır, 1 Kasım 2026", "https://www.yeniasir.com.tr/yasam/2026/11/01/sosyal-medyada-330-milyon-hesaba-e-devlet-dogrulamasi-yeni-duzenleme-nasil-olacak"], ["NTV: Yönetmelik Resmi Gazete'de", "https://ntv.com.tr/turkiye/sosyal-medyaya-15-yas-siniri-yeni-duzenleme-resmi-gazetede-1745607"], ["Daily Sabah: Uzman görüşleri", "https://www.dailysabah.com/turkiye/turkiyes-age-limits-alone-cannot-protect-children-online-experts-warn/news/amp"], ["Bianet: Koruma mı, hak kaybı mı?", "https://bianet.org/haber/cocuklara-sosyal-medya-yasagi-koruma-mi-hak-gaspi-mi-316909"]]},
 {"id": "cocukhaklari", "bolum": "turkiye", "konu": "Haklar", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "baslik": "20 Kasım Dünya Çocuk Hakları Günü: Haklar her çocuk için aynı", "ozet": "Türkiye'de ve dünyada 20 Kasım, Dünya Çocuk Hakları Günü olarak kutlandı. Bu tarih, çocukların haklarını koruyan uluslararası sözleşmenin kabul edildiği gün.", "neOldu": ["Birleşmiş Milletler, 20 Kasım 1959'da Çocuk Hakları Bildirgesi'ni kabul etti. Tam 30 yıl sonra, 20 Kasım 1989'da da Çocuk Haklarına Dair Sözleşme kabul edildi. Bu sözleşme, dünyada en çok ülkenin onayladığı insan hakları anlaşması.", "Sözleşmede 54 madde var. Eğitim almak, sağlıklı büyümek, oyun oynamak ve dinlenmek, kendini ilgilendiren konularda fikrini söylemek bunlardan bazıları. Türkiye sözleşmeyi 1990'da imzaladı. Her yıl bu günde okullarda ve şehirlerde etkinlikler düzenleniyor."], "neden": "Haklarını bilmek, gerektiğinde yardım istemeni ve başkalarının haklarına saygı göstermeni kolaylaştırır. Bu haklar dünyanın her yerindeki bütün çocuklar için geçerli.", "kelimeler": ["cocukhaklari", "bm"], "soru": "Sözleşmedeki haklardan hangisi sana en önemli geliyor? Neden?", "kaynaklar": [["Hacettepe Üniversitesi Halk Sağlığı: Çocuk Hakları Günü", "https://halksagligi.hacettepe.edu.tr/duyurular/halkayonelik/cocukhaklari2025.pdf"], ["Küre Ansiklopedi: 20 Kasım", "https://kureansiklopedi.com/tr/detay/20-kasim-dunya-cocuk-haklari-gunu-6fb12"], ["CNN Türk: 20 Kasım'ın anlamı", "https://www.cnnturk.com/turkiye/galeri/20-kasim-dunya-cocuk-haklari-gunu-mesajlari-2025-dunya-cocuk-haklari-gunu-ne-zaman-20-kasim-bugun-mu-iste-anlam-ve-onemi-2362195"]]},
 {"id": "amonyakgemi", "bolum": "dunya", "konu": "Teknoloji", "sure": 3, "seviye": "10+", "dosya": "iklim", "tarih": "22 Kasım 2026", "yer": {"ad": "Ariake Tersanesi, Kumamoto, Japonya", "lat": 32.93, "lon": 130.45}, "baslik": "Japonya'da hem motoru hem elektriği amonyakla çalışan gemi tanıtıldı", "ozet": "Japon denizcilik şirketi NYK, Izanami adlı gaz taşıma gemisini tanıttı. Şirkete göre bu, hem ana motoru hem de elektrik üreten yardımcı motoru amonyakla çalışan ilk gemi.", "neOldu": ["Gemi, 17 Kasım'da Japonya'nın Kumamoto bölgesindeki bir tersanede tanıtıldı. Izanami, 40 bin metreküp amonyak taşıyabilen bir yük gemisi. Hem gemiyi ilerleten ana motoru hem de gemiye elektrik sağlayan yardımcı motoru yakıt olarak amonyak kullanabiliyor.", "Şirket, geminin sıradan gemi yakıtıyla çalışan gemilere göre sera gazı salımını yüzde 90'dan fazla azaltmasını bekliyor. Izanami şimdi deneme seferlerine çıkacak ve teknolojinin gerçek koşullarda nasıl çalıştığı ölçülecek."], "neden": "Dünyadaki eşyaların çoğu gemilerle taşınıyor ve bu gemiler çoğunlukla petrolden üretilen yakıt yakıyor. Amonyak yandığında karbondioksit çıkmıyor; bu yüzden denizcilikte iklim değişikliğiyle mücadelenin yollarından biri olarak görülüyor.", "sinir": "Yüzde 90'lık azalma şimdilik bir beklenti; gerçek sonuç deneme seferlerinde ölçülecek. Amonyak zehirli bir madde olduğu için gemide güvenle kullanılması da dikkatle denenmesi gereken konulardan biri.", "bizeNe": "İstanbul ve Çanakkale boğazlarından her yıl on binlerce gemi geçiyor. Gemilerin daha temiz yakıtlarla çalışması, bu su yollarının çevresinde yaşayanlar için daha temiz hava demek.", "kelimeler": ["japonya", "amonyak", "seragazi", "iklim"], "soru": "Gemiler, uçaklar ve arabalar için yakıt seçerken sence nelere dikkat edilmeli?", "kaynaklar": [["Nation Thailand", "https://www.nationthailand.com/news/40073615"], ["Maritime Gateway", "https://www.maritimegateway.com/nyk-unveils-izanami-with-ammonia-fuelled-propulsion-and-power-generation/"], ["Seatrade Maritime", "https://www.seatrade-maritime.com/tankers/nyk-unveils-first-vessel-with-ammonia-fuelled-main-and-auxiliary-engines"]]},
 {"id": "devkus", "bolum": "dunya", "konu": "Bilim", "sure": 3, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "yer": {"ad": "Liang Bua Mağarası, Flores, Endonezya", "lat": -8.53, "lon": 120.46}, "baslik": "Ünlü mağaradan çıkan tek kemik, kayıp bir dev kuşu tanıttı", "ozet": "Endonezya'nın Flores Adası'ndaki Liang Bua Mağarası'nda bulunan bir bacak kemiği, soyu tükenmiş yeni bir kuş türüne ait çıktı. Kuşa Megapodius rokusi adı verildi.", "neOldu": ["Kemik 2009'da, yaklaşık 190 bin ile 120 bin yıl öncesine ait toprak katmanlarından çıkarıldı. Araştırmacılar kemiği inceleyerek kuşun yaklaşık 3,9 kilogram geldiğini hesapladı. Bugün Flores'te yaşayan akrabası ise yarım kilo ile 1,2 kilo arasında.", "Bu kuş, megapod denen bir kuş ailesinden. Megapodlar yumurtalarının üzerine kuluçkaya yatmaz; onları toprak ya da çürüyen yaprak yığınlarına gömer ve yığının sıcaklığıyla ısıtır. Yeni türe, mağaradaki hayvan kalıntılarını incelemiş Endonezyalı bilim insanı Rokus Due Awe'nin adı verildi. Araştırma Alcheringa dergisinde yayımlandı."], "neden": "Liang Bua, boyu yaklaşık bir metre olan küçük bir insan türünün kalıntılarının bulunduğu ünlü bir mağara. Bu kemik, Asya ile Avustralya arasındaki adalarda bulunan ilk megapod fosili ve o dönemde adada yaşayan hayvanları anlamamıza yardım ediyor.", "sinir": "Elde yalnızca bir bacak kemiğinin yarısı var. Kanat kemikleri bulunmadığı için kuşun uçup uçamadığı bilinmiyor. Ne zaman ve neden yok olduğu da henüz belli değil.", "bizeNe": "Türkiye'de de mağaralarda ve eski yerleşim yerlerinde bulunan kemikler, geçmişte Anadolu'da hangi hayvanların yaşadığını gösteriyor. Örneğin Anadolu'da bir zamanlar aslanların da yaşadığını bu tür izlerden biliyoruz.", "kelimeler": ["endonezya", "fosil", "megapod"], "soru": "Tek bir kemikten bir hayvanın ne kadar ağır olduğunu tahmin etmek zorunda kalsaydın, nelere bakardın?", "kaynaklar": [["Sci.News", "https://www.sci.news/paleontology/megapodius-rokusi-15170.html"], ["Mongabay Endonezya, 16 Kasım 2026", "https://mongabay.co.id/2026/11/16/sepotong-tulang-kaki-ungkap-burung-purba-dari-flores/"], ["The Daily Galaxy", "https://dailygalaxy.com/2026/11/flores-cave-bone-new-giant-species/"]]},
 {"id": "ucankurbaga", "bolum": "dunya", "konu": "Doğa", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "yer": {"ad": "Mekongga Dağları, Sulawesi, Endonezya", "lat": -3.65, "lon": 121.25}, "baslik": "Ağaçlar arasında süzülen yeni bir kurbağa türü bulundu", "ozet": "Endonezya'nın Sulawesi Adası'nda, ağaçtan ağaca süzülebilen yeni bir \"uçan kurbağa\" türü tanımlandı. Bu kurbağa yumurtalarını köpük yerine jöle gibi bir kütlenin içine bırakıyor.", "neOldu": ["Rhacophorus kurniatiae adı verilen kurbağa, Güneydoğu Sulawesi'deki Mekongga Dağları'nda, yüksekte bulunan bir gölün çevresinde yaşıyor. Uçan kurbağalar aslında uçmuyor; parmaklarının arasındaki geniş zarları açarak paraşüt gibi süzülüyor.", "Endonezyalı araştırmacılar kurbağanın 28 farklı vücut özelliğini ölçtü, DNA'sını inceledi ve seslerini kaydetti. Böylece akrabalarına çok benzese de ayrı bir tür olduğunu gösterdiler. Türe, kurbağalar ve sürüngenler üzerine çalışmış bilim insanı Hellen Kurniati'nin adı verildi. Sonuçlar Zootaxa dergisinde yayımlandı."], "neden": "Akraba türler yumurtalarını köpükten yuvalara bırakırken bu kurbağa jöle benzeri bir kütle kullanıyor; yumurtalar ve iribaşlar bu jölenin içinde gelişiyor. Bu, canlıların yavrularını korumak için ne kadar farklı yollar bulduğunu gösteriyor.", "sinir": "Bu kurbağa şimdilik yalnızca tek bir gölün çevresinden biliniyor. Kaç tane olduğu ve başka yerlerde yaşayıp yaşamadığı henüz bilinmiyor.", "bizeNe": "Türkiye'de de yalnızca belli bir dere ya da gölde yaşayan kurbağa ve semender türleri var. Sulak alanları korumak, bu canlıların geleceği için çok önemli.", "kelimeler": ["endonezya", "iribas"], "soru": "Bir hayvanın yeni bir tür olduğunu kanıtlamak için sen olsan neleri karşılaştırırdın?", "kaynaklar": [["Sci.News", "https://www.sci.news/biology/rhacophorus-kurniatiae-15204.html"], ["EurekAlert", "https://www.eurekalert.org/news-releases/1152323"], ["IFLScience", "https://www.iflscience.com/new-flying-frog-discovered-in-indonesia-it-glides-between-trees-has-a-pointy-snout-and-does-something-really-weird-with-its-babies-85224"]]},
 {"id": "klazomenai", "bolum": "turkiye", "konu": "Arkeoloji", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "yer": {"ad": "Urla, İzmir", "lat": 38.32, "lon": 26.77}, "baslik": "Urla'da 2 bin 600 yıllık yerleşim izleri koruma altına alındı", "ozet": "İzmir'in Urla ilçesinde, antik Klazomenai kentinin bulunduğu bölgedeki bir arazide çok eski yerleşim izleri bulundu. Alan birinci derece arkeolojik sit alanı olarak tescil edildi.", "neOldu": ["Kazılar özel bir arazide yapıldı. Arkeologlar, milattan önce 6. yüzyıla, yani yaklaşık 2 bin 600 yıl öncesine uzanan yerleşim izleri ve milattan önce 4. yüzyıla ait, çok odalı bir yapı topluluğu buldu.", "Bu buluntuların ardından alan birinci derece arkeolojik sit alanı olarak tescil edildi. Bu, alanın koruma altında olduğu ve üzerine yeni bina yapılamayacağı anlamına geliyor."], "neden": "Urla, antik çağın önemli kentlerinden Klazomenai'ye ev sahipliği yapmıştı. Klazomenai zeytinyağı üretimiyle tanınıyordu. Bu tür alanlar korunmazsa, geçmişe dair bilgiler sonsuza dek kaybolabilir.", "kelimeler": ["izmir", "sitalani", "arkeoloji"], "soru": "Evinin bahçesinde 2 bin 600 yıllık bir yerleşimin izleri bulunsaydı ne hissederdin?", "kaynaklar": [["İz Gazete", "https://www.izgazete.net/izmirde-topragin-altindan-planli-antik-kent-cikti-2-bin-600-yillik-miras-koruma-altinda"], ["Pencere Haber", "https://www.pencerehaber.com/haber/urlada-2-bin-600-yillik-tarihe-koruma-1820.html"], ["İzmir İl Kültür ve Turizm Müdürlüğü: Klazomenai", "https://izmir.ktb.gov.tr/EN-240333/klazomenai-urla.html"]]},
 {"id": "suayisi", "bolum": "dunya", "konu": "Doğa", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "yer": {"ad": "Senghor deniz dağı, Atlas Okyanusu", "lat": 17.2, "lon": -21.95}, "baslik": "Okyanustaki bir deniz dağında iki yeni \"su ayısı\" türü bulundu", "ozet": "Bilim insanları, Atlas Okyanusu'ndaki Senghor deniz dağının tepesinden alınan kum örneklerinde daha önce bilinmeyen iki tardigrad türü tanımladı.", "neOldu": ["Tardigradlara su ayısı da deniyor. Boyları milimetrenin altında olan, sekiz bacaklı minik canlılar. İncelenen örnekler, Batı Afrika açıklarında, Yeşil Burun Adaları'na yakın bir deniz dağından 2009'da bir araştırma gemisiyle toplanmıştı.", "Araştırmacılar örneklerde 219 tardigrad buldu; bunların 212'si deniz dağının tepesindendi. Aralarında bilim için yeni olan iki tür vardı. Bunlardan birinin adı Parastygarctus potercha. Çalışma ekim sonunda ZooKeys dergisinde yayımlandı."], "neden": "Deniz dağları, okyanus tabanından yükselen ama su yüzeyine ulaşmayan dağlar. Çevrelerindeki derin denizden farklı yaşam alanları oluşturuyorlar. Bu çalışma, böyle yerlerin minik canlılar için birer vaha olabileceğini gösteriyor.", "sinir": "Yeni türlerden biri için şimdilik yalnızca dişi bireyler bulundu. Bu canlıların başka deniz dağlarında da yaşayıp yaşamadığı henüz bilinmiyor.", "bizeNe": "Tardigradlar Türkiye'de de yaşıyor: yosunlarda, toprakta ve denizlerde. İyi bir mikroskopla, ıslatılmış bir yosun parçasının içinde onları görmek mümkün.", "kelimeler": ["tardigrad", "denizdagi", "yesilburun", "derindeniz"], "soru": "Bir mikroskobun olsaydı, ilk olarak neyin içine bakmak isterdin?", "kaynaklar": [["A-Z Animals", "https://a-z-animals.com/blog/scientists-find-two-new-armored-water-bears-on-atlantic-seamount/"], ["Nazology (Japonca)", "https://nazology.kusuguru.co.jp/archives/205684"]]},
 {"id": "bepimerkur", "bolum": "dunya", "konu": "Uzay", "sure": 3, "seviye": "8+", "dosya": "uzay", "tarih": "22 Kasım 2026", "baslik": "Sekiz yıllık yolculuk bitti: BepiColombo Merkür'ün yörüngesinde", "ozet": "Avrupa ve Japonya'nın ortak uzay aracı BepiColombo, 21 Kasım'da Güneş'e en yakın gezegen Merkür'ün etrafında dönmeye başladı.", "neOldu": ["BepiColombo, Ekim 2018'de fırlatıldı. Merkür'e doğrudan gitmek yerine Dünya, Venüs ve Merkür'ün yanından defalarca geçerek hızını ayarladı. Bu uzun yolculuk yaklaşık sekiz yıl sürdü.", "Araç aslında birbirine bağlı iki ayrı uydudan oluşuyor. Biri Avrupa Uzay Ajansı'nın (ESA), diğeri Japonya Uzay Ajansı JAXA'nın. 3 Eylül'de onları buraya kadar taşıyan itici bölümden ayrıldılar. 21 Kasım'da da Merkür'ün kütle çekimine yakalanıp gezegenin yörüngesine girdiler.", "İş henüz bitmedi. İki uydu 9-10 Aralık'ta birbirinden ayrılacak ve her biri kendi yörüngesine yerleşecek. Bilimsel ölçümlerin Nisan 2027'de başlaması planlanıyor."], "neden": "Merkür, Güneş Sistemi'nin en az keşfedilmiş gezegenlerinden biri. Bugüne kadar yörüngesine yalnızca NASA'nın MESSENGER aracı girebilmişti. BepiColombo, gezegenin yüzeyini, içini ve çevresindeki manyetik alanı ayrıntılı olarak inceleyecek.", "bizeNe": "Merkür'ü anlamak, Dünya gibi kayalık gezegenlerin nasıl oluştuğunu anlamamıza yardım ediyor. Merkür bazı akşamlar ve sabahlar Türkiye'den de çıplak gözle görülebiliyor; ufka yakın, parlak bir nokta gibi.", "kelimeler": ["merkur", "esa", "jaxa", "yorunge", "gunes"], "soru": "Bir gezegene sekiz yılda varan bir aracın ekibinde olsaydın, yolculuk boyunca en çok neyi merak ederdin?", "kaynaklar": [["Hürriyet, 22 Kasım 2026", "https://www.hurriyet.com.tr/dunya/merkure-ulasti-43386613"], ["WRAL, 22 Kasım 2026", "https://www.wral.com/weather/bepicolombo-nov-2026/"], ["ESA: BepiColombo'nun varışı", "https://www.esa.int/Science_Exploration/Space_Science/BepiColombo/Latest_updates_BepiColombo_s_arrival_at_Mercury"]]},
 {"id": "ogretmengunu", "bolum": "turkiye", "konu": "Okul", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "baslik": "Salı günü Öğretmenler Günü: Bu yılın teması \"Hep Sen Varsın Diye\"", "ozet": "24 Kasım Salı günü Türkiye'de Öğretmenler Günü kutlanacak. Milli Eğitim Bakanlığı bu yıl için \"Hep Sen Varsın Diye...\" temasını seçti.", "neOldu": ["Milli Eğitim Bakanlığı, kutlamaların nasıl yapılacağını anlatan genelgeyi 9 Ekim'de 81 ile gönderdi. Okullarda ve şehirlerde öğretmenler için törenler, ziyaretler ve etkinlikler düzenlenecek.", "Hafta boyunca illerde ağaç dikilecek. \"Öğretmen Gözüyle\" adlı bir fotoğraf yarışmasında dereceye girenlerin ödülleri de kutlamalarda verilecek. Emekli öğretmenler ve hayatını kaybeden öğretmenlerin aileleri de ziyaret edilecek."], "neden": "Türkiye'de Öğretmenler Günü 1981'den beri 24 Kasım'da kutlanıyor. Bu tarih, Atatürk'ün 1928'de okuma yazma seferberliği için açılan Millet Mektepleri'nin \"Başöğretmen\"liğini kabul ettiği güne denk geliyor.", "kelimeler": ["meb", "ataturk"], "soru": "Bir öğretmenine teşekkür etmek isteseydin, ona ne yazardın ya da ne çizerdin?", "kaynaklar": [["MEB: Öğretmenler Günü genelgesi", "https://meb.gov.tr/24-kasim-ogretmenler-gunu-genelgesi-yayimlandi/haber/42152/tr"], ["24 Saat Gazetesi", "https://www.24saatgazetesi.com/meb-24-kasim-ogretmenler-gunu-etkinlikleri-yil-geneline-yayilacak"], ["MEB: Öğretmenlere yönelik kampanya", "https://meb.gov.tr/egitim-neferlerine-minnet-kampanyasi-devam-ediyor/haber/42531/tr"]]},
 {"id": "akyatan", "bolum": "turkiye", "konu": "Doğa", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "yer": {"ad": "Akyatan Lagünü, Karataş, Adana", "lat": 36.62, "lon": 35.25}, "baslik": "Göçmen kuşların kış durağı Akyatan Lagünü yeni misafirlerini bekliyor", "ozet": "Adana'nın Karataş ilçesindeki Akyatan Lagünü, her kış binlerce göçmen kuşa ev sahipliği yapıyor. Doğa Koruma ve Milli Parklar ekipleri alanı kuşlar için koruyor.", "neOldu": ["Akyatan, denizden ince bir kum şeridiyle ayrılmış büyük bir tuzlu su gölü. Çukurova Deltası'nda yer alıyor ve çevresiyle birlikte yaklaşık 14 bin 700 hektarlık bir koruma alanı oluşturuyor. Bu, yaklaşık 20 bin futbol sahası büyüklüğünde.", "Kuzeyden gelen kuşlar kışı burada geçiriyor. Flamingolar, turnalar ve pek çok ördek türü lagünde beslenip dinleniyor. Ziyaretçilerin kuşları rahatsız etmeden izleyebilmesi için iki gözlem kulesi, gözlem noktaları ve yürüyüş yolları yapıldı."], "neden": "Göçmen kuşlar binlerce kilometre uçarken yol üstündeki sulak alanlarda dinlenmek zorunda. Akyatan, 1998'de uluslararası Ramsar Sözleşmesi'yle koruma altına alındı ve 2005'te Yaban Hayatı Geliştirme Sahası oldu.", "kelimeler": ["lagun", "ramsar", "adana"], "soru": "Binlerce kilometre uçan bir kuş olsaydın, mola vereceğin yerde nelerin olmasını isterdin?", "kaynaklar": [["BHA, 22 Kasım 2026", "https://www.bha.net.tr/adana/akyatan-lagunu-gocmen-kuslara-kislik-yuva-oluyor/469929"], ["Hürriyet Daily News: Çukurova Deltası'nda kış kuşları", "https://www.hurriyetdailynews.com/cukurova-delta-hosts-rich-birdlife-even-in-winter-217845"], ["NTV: Akyatan Lagünü ve flamingolar", "https://www.ntv.com.tr/seyahat/galeri-adanada-doga-harikasi-akyatan-lagunu-hem-flamingolari-hem-de-fotografseverleri-agirliyor,z8pRV0e9S0OzGlvvMzKGXw"]]},
 {"id": "baoyildiz", "bolum": "dunya", "konu": "Uzay", "sure": 3, "seviye": "10+", "dosya": "uzay", "tarih": "22 Kasım 2026", "baslik": "Komşu galakside dev bir yıldız, küçük eşini yuttu", "ozet": "Gökbilimciler Andromeda Galaksisi'nde iki yıldızın birleştiğini gördü. James Webb Uzay Teleskobu, olayın ardından neler olduğunu ilk kez bu kadar erken görüntüledi.", "neOldu": ["Evrendeki yıldızların bir kısmı tek değil, çift olarak birbirinin etrafında döner. Andromeda'daki bir çiftte büyük yıldız şişkin bir süperdev, küçüğü ise Güneş'ten biraz hafif bir yıldızdı. Küçük yıldız yavaş yavaş büyük yıldızın dış katmanlarına girdi ve sonunda onunla birleşti.", "Birleşme sırasında yıldız birden çok parladı. Araştırmacılar bu yıldıza Bao adını verdi. James Webb Uzay Teleskobu, parlamanın en yüksek noktasından 47 gün sonra, 24 Aralık 2025'te Bao'yu gözlemledi. Sonuçlar Nature dergisinde yayımlandı ve NASA bu hafta duyurdu."], "neden": "Yıldız birleşmeleri çok nadir yakalanıyor. Webb'in ölçümleri sayesinde bilim insanları, artık görünmeyen küçük yıldızın kütlesini ilk kez hesaplayabildi.", "sinir": "Gökbilimciler olanları teleskop verilerinden ve bilgisayar modellerinden çıkarıyor. Birleşmenin tam olarak nasıl ilerlediğine dair bazı ayrıntılarda kaynaklar arasında farklılıklar var.", "bizeNe": "Andromeda, Samanyolu'na en yakın büyük galaksi. Çok karanlık ve açık bir gecede Türkiye'den de çıplak gözle soluk bir bulut gibi görülebiliyor.", "kelimeler": ["andromeda", "galaksi", "teleskop", "nasa"], "soru": "Gökyüzündeki yıldızların bir kısmının aslında çift olduğunu biliyor muydun? Sence iki yıldız nasıl bu kadar yakın dönebilir?", "kaynaklar": [["NASA", "https://science.nasa.gov/missions/webb/nasa-data-clinches-first-of-its-kind-stellar-merger/"], ["Science News", "https://sciencenews.org/article/stars-andromeda-galaxy-merge-little-bao"], ["Sci.News", "https://www.sci.news/astronomy/webb-star-merger-andromeda-galaxy-15207.html"]]},
 {"id": "sufaresi", "bolum": "dunya", "konu": "Doğa", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "yer": {"ad": "Yayu Biyosfer Rezervi, Etiyopya", "lat": 8.4, "lon": 35.8}, "baslik": "Neslinin tükendiği sanılan su faresi yaklaşık 100 yıl sonra yeniden görüldü", "ozet": "Bilim insanlarının yalnızca 1927'de yakalanmış tek bir örnekten bildiği Etiyopya su faresi, Etiyopya'nın güneybatısındaki ormanlarda yeniden bulundu.", "neOldu": ["Etiyopya su faresi, derelerde yaşayan ve suda yüzebilen küçük bir kemirgen. Bilim dünyası onu 1927'de toplanan tek bir örnekten tanıyordu. Uluslararası Doğayı Koruma Birliği listesinde \"tükenmiş olabilir\" diye geçiyordu.", "Ekim 2026'da Etiyopya Biyoçeşitlilik Enstitüsü'nden bir araştırmacı, Yayu Biyosfer Rezervi'nde bu fareyi yakaladı. Bu yer, ilk örneğin bulunduğu yerden yüzlerce kilometre uzakta. Çalışma, Almanya'daki doğa koruma derneği NABU'nun bir projesi kapsamında yapıldı."], "neden": "Kaybolduğu sanılan bir türün yeniden bulunması, doğanın hâlâ saklı köşeleri olduğunu gösteriyor. Yaşadığı ormanı korumak artık daha da önemli.", "sinir": "Şimdilik bu türün kaç bireyinin yaşadığı ve ne kadar geniş bir alana yayıldığı bilinmiyor. Bunu anlamak için yeni araştırmalar gerekiyor.", "bizeNe": "Türkiye'de de uzun süre görülmeyip yeniden bulunan canlılar var. Hayvanları yaşadıkları yerleri koruyarak kurtarabiliyoruz.", "kelimeler": ["etiyopya", "kemirgen", "almanya"], "soru": "Kaybolduğu sanılan bir hayvanı sen bulsaydın, ilk olarak ne yapardın?", "kaynaklar": [["National Geographic", "https://www.nationalgeographic.com/animals/article/ethiopia-water-mouse-extinct-rediscovery"], ["NABU (Almanca)", "https://www.nabu.de/wir-ueber-uns/news/aethiopische-wassermaus-wiederentdeckt"], ["Bluewin / Keystone-SDA", "https://www.bluewin.ch/en/news/ethiopian-water-rat-believed-to-be-extinct-spotted-li.3668420"]]},
 {"id": "sarikod", "bolum": "turkiye", "konu": "Hava", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "baslik": "21 ilde sarı kodlu uyarı: Doğuda kuvvetli yağmur, yükseklerde kar", "ozet": "Meteoroloji, bugün başta doğu illeri olmak üzere 21 il için sarı kodlu uyarı yaptı. Yüksek yerlerde kar bekleniyor.", "neOldu": ["Meteoroloji Genel Müdürlüğü'ne göre Doğu Karadeniz, Doğu Anadolu, Güneydoğu Anadolu'nun bazı yerleri ve Doğu Akdeniz'de kuvvetli yağış bekleniyor. Uyarı listesinde Trabzon, Rize, Erzurum, Muş, Hatay ve Samsun gibi iller var.", "Doğu Anadolu'da 2.000 metreden yüksek yerlerde yağmur yerini kara bırakabilir. Bazı bölgelerde rüzgârın saatte 60 kilometreye kadar çıkması, gece saatlerinde ise etkisini kaybetmesi bekleniyor."], "neden": "Sarı kod, \"hava kötüleşebilir, dikkatli ol\" demek. Böyle günlerde dere yataklarından uzak durmak, yağmurluk ya da kalın giysiyle çıkmak ve büyüklerin uyarılarını dinlemek önemli.", "kelimeler": ["sarikod", "meteoroloji"], "soru": "Senin yaşadığın yerde bugün hava nasıl? Bir hafta boyunca havayı gözlemleyip küçük bir hava durumu günlüğü tutmaya ne dersin?", "kaynaklar": [["AA, 22 Kasım 2026", "https://www.aa.com.tr/tr/gundem/meteorolojiden-dogu-kesimlerde-kuvvetli-saganak-ve-kar-uyarisi/4133423"], ["Hürriyet, 22 Kasım 2026", "https://hurriyet.com.tr/gundem/21-ile-sari-kodlu-uyari-kuvvetli-yagis-ve-60-kilometreyi-bulan-ruzgar-bekleniyor-43386652"], ["BirGün", "https://www.birgun.net/haber/meteoroloji-den-kuvvetli-saganak-ve-kar-yagisi-uyarisi-747705"]]},
 {"id": "sessizkaradelik", "bolum": "dunya", "konu": "Uzay", "sure": 3, "seviye": "10+", "dosya": "uzay", "tarih": "22 Kasım 2026", "baslik": "Bazı yıldızlar patlamadan, sessizce kara deliğe dönüşüyor olabilir", "ozet": "Bilim insanları 257 kara delik çarpışmasını inceledi. Sonuçlar, bazı dev yıldızların ömrünün sonunda patlamadan çöktüğünü düşündürüyor.", "neOldu": ["Çok büyük yıldızlar yakıtları bitince genellikle süpernova denen dev bir patlamayla ölür, geriye de bir kara delik kalabilir. Ama kuramlara göre bazı yıldızlar hiç patlamadan, kendi üzerine çökerek kara deliğe dönüşebilir. Buna \"başarısız süpernova\" deniyor.", "Araştırmacılar, ABD, İtalya ve Japonya'daki dedektörlerin son on yılda yakaladığı 257 kara delik birleşmesini inceledi. Kara deliklerin çoğu Güneş'in yaklaşık 10 katı ağırlığındaydı. Güneş'in 12 ila 16 katı ağırlığındaki kara delikler ise beklenenden çok azdı. Ekip, bu tablonun sessizce çöken yıldızlarla açıklanabileceğini öne sürüyor."], "neden": "Kara deliklerin nasıl doğduğunu anlamak, yıldızların yaşam öykülerini anlamanın önemli bir parçası.", "sinir": "Başarısız süpernovaların var olduğuna dair henüz kesin bir kanıt yok. Bu araştırma güçlü bir ipucu sunuyor ama araştırmacılar da konunun daha çok incelenmesi gerektiğini söylüyor.", "bizeNe": "Bu çarpışmaları yakalayan dedektörler, uzayda yayılan çok küçük titreşimleri ölçüyor. Dünyanın farklı ülkelerinden bilim insanları bu verileri birlikte inceliyor.", "kelimeler": ["karadelik", "supernova", "gunes"], "soru": "Bir yıldız sessizce yok olsa, sence bilim insanları bunu nasıl fark edebilir?", "kaynaklar": [["Space.com", "https://space.com/astronomy/black-holes/astronomers-discover-rare-black-holes-that-formed-when-stars-failed-to-go-supernova"], ["EurekAlert", "https://www.eurekalert.org/news-releases/1151330"]]},
 {"id": "devkemirgen", "bolum": "dunya", "konu": "Bilim", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "yer": {"ad": "Güney Tayland", "lat": 8.5, "lon": 99.0}, "baslik": "İki dişten çıkan sır: 34 milyon yıl önce köpek büyüklüğünde bir kemirgen yaşamış", "ozet": "Tayland'da bir madende bulunan iki fosil diş, yaklaşık 34 milyon yıl önce yaşamış dev bir kemirgene ait. Bu, döneminin bilinen en büyük kemirgeni olabilir.", "neOldu": ["Dişler 2004'te güney Tayland'daki bir madende bulundu ama uzun süre hangi hayvana ait oldukları anlaşılamadı. Tayland, Fransa ve Kanada'dan araştırmacılar, yirmi yılı aşkın bir süre sonra dişleri ayrıntılı olarak inceledi.", "Yeni türe Yakamys sirindhornae adı verildi. Araştırmacılar hayvanın yaklaşık 30 kilogram ağırlığında olabileceğini hesapladı. Bu, o dönemde yaşadığı bilinen öteki kemirgenlerin yaklaşık iki katı. Sonuçlar Scientific Reports dergisinde yayımlandı."], "neden": "Dev kemirgen fosilleri şimdiye kadar çoğunlukla Güney Amerika'da ve daha sonraki dönemlerde bulunmuştu. Bu keşif, kemirgenlerin Asya'da çok daha önce büyük boyutlara ulaştığını gösteriyor.", "sinir": "Elde sadece iki diş var. Bu yüzden hayvanın ağırlığı kaba bir tahmin. Nasıl göründüğü, ne yediği ve nasıl yaşadığı da bilinmiyor.", "bizeNe": "Bugün de fareler, sincaplar ve kunduzlar gibi kemirgenler Türkiye'de yaşıyor. Fosiller, tanıdığımız hayvanların atalarının ne kadar farklı olabildiğini gösteriyor.", "kelimeler": ["tayland", "fosil", "kemirgen"], "soru": "Sadece iki dişten bir hayvanın neye benzediğini tahmin etmek zorunda kalsaydın, nelere bakardın?", "kaynaklar": [["ScienceDaily, 10 Kasım 2026", "https://www.sciencedaily.com/releases/2026/11/261110042532.htm"], ["Sci.News", "https://www.sci.news/paleontology/yakamys-sirindhornae-15189.html"], ["Discover Wildlife", "https://www.discoverwildlife.com/prehistoric-life/yakamys-sirindhornae-ancient-rodent"]]},
 {"id": "cop31son", "bolum": "turkiye", "konu": "İklim", "sure": 3, "seviye": "10+", "dosya": "iklim", "tarih": "22 Kasım 2026", "yer": {"ad": "Antalya, Türkiye", "lat": 36.89, "lon": 30.71}, "baslik": "Antalya'daki iklim zirvesi anlaşma olmadan bitti", "ozet": "Yaklaşık 200 ülkenin katıldığı COP31, planlanandan iki gün uzun sürdü. Ama ülkeler ortak bir metinde uzlaşamadı.", "neOldu": ["Birleşmiş Milletler İklim Zirvesi COP31, 9 Kasım'da Antalya'da başlamıştı ve 20 Kasım'da bitmesi planlanıyordu. Görüşmeler iki gün uzadı ve bugün sona erdi. Zirvenin sonunda herkesin onaylaması gereken ortak karar metni kabul edilmedi.", "Zirvenin başkanı Çevre, Şehircilik ve İklim Değişikliği Bakanı Murat Kurum, metin üzerinde uzlaşma olmadığı için kararların kabul edilmediğini açıkladı. En büyük anlaşmazlık kömür, petrol ve doğal gaz gibi fosil yakıtlar konusundaydı. Son taslakta bu yakıtların adı hiç geçmiyordu.", "BM zirvelerinde kararlar oy çokluğuyla değil, oybirliğine yakın bir uzlaşmayla alınıyor. Yani birkaç ülkenin itirazı bile bir metnin kabul edilmesini engelleyebiliyor."], "neden": "Ülkeler on yıl önce Paris'te Dünya'nın ısınmasını 1,5 derecede tutmaya çalışma sözü vermişti. BM Genel Sekreteri Antonio Guterres, dünyanın bu sınırı aşma yolunda olduğunu ve çok daha fazlasını yapmak gerektiğini söyledi.", "taraflar": "Avrupa Birliği, Panama ve Marshall Adaları gibi ülkeler, fosil yakıtlardan vazgeçilmesine dair açık bir ifade olmadan metni desteklemedi. Suudi Arabistan'ın da aralarında olduğu Arap ülkeleri ise havadaki karbonu yakalama gibi yöntemlerin metinde yer almasını savundu. Afrika ülkeleri, iklim değişikliğinden etkilenen ülkelere yapılacak para yardımının yetersiz kaldığını söyledi ama metni engellemedi.", "bizeNe": "Zirve Türkiye'de yapıldı ve Türkiye zirvenin başkanıydı. Türkiye de kuraklık, orman yangınları ve sıcak hava dalgaları gibi iklim değişikliğinin etkilerini yaşayan ülkelerden biri.", "kelimeler": ["cop", "iklim", "fosilyakit", "zirve", "ab"], "soru": "Bir sınıfta bir karar alınırken herkesin kabul etmesi mi gerekmeli, yoksa çoğunluğun kabul etmesi yeterli mi? Neden?", "kaynaklar": [["BM Haber, 22 Kasım 2026", "https://news.un.org/en/story/2026/11/1168855"], ["CBS News", "https://www.cbsnews.com/news/un-cop31-climate-conference-ends-no-agreement-fossil-fuel-debate-standstill/"], ["ABC News", "https://abcnews.com/Technology/climate-conference-ends-signature-agreement-countries-clash-fossil/story?id=138359179"]]},
 {"id": "okul23", "bolum": "turkiye", "konu": "Okul", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "baslik": "Ara tatil bitti: Yarın okullar yeniden açılıyor", "ozet": "Dokuz günlük ara tatil sona erdi. Öğrenciler 23 Kasım Pazartesi yeniden derslere başlıyor.", "neOldu": ["Milli Eğitim Bakanlığı'nın takvimine göre birinci dönemin ara tatili 16-20 Kasım arasındaydı. Hafta sonlarıyla birlikte dokuz gün süren tatil bugün bitiyor, okullar yarın açılıyor.", "Birinci dönem 22 Ocak 2027 Cuma günü karnelerle sona erecek. Ardından 25 Ocak-5 Şubat arasında yarıyıl tatili var. İkinci dönemin ara tatili ise 8-12 Mart 2027'de."], "neden": "Tatil dönüşü ilk günler biraz zor gelebilir. Uyku saatini erkenden okul düzenine çekmek, pazartesi sabahını kolaylaştırır.", "kelimeler": ["meb", "aratatil"], "soru": "Ara tatilde yaptığın en güzel şey neydi? Bir sonraki tatil için ne planlarsın?", "kaynaklar": [["Milli Gazete: Okullar ne zaman açılıyor?", "https://www.milligazete.com.tr/kasim-ara-tatili-sonrasi-okullar-ne-zaman-aciliyor-23-kasimda-ders-var-mi-2026-2027-okul-takvimi-nedir"], ["Cumhuriyet: 2026-2027 okul takvimi", "https://www.cumhuriyet.com.tr/turkiye/kasim-ara-tatiline-kac-gun-kaldi-2026-2027-okullar-ne-zaman-kapanacak-2554244"]]},
 {"id": "superay", "bolum": "turkiye", "konu": "Gökyüzü", "sure": 2, "seviye": "8+", "dosya": "uzay", "tarih": "22 Kasım 2026", "baslik": "Salı akşamı gökyüzünde süper ay var", "ozet": "24 Kasım Salı günü dolunay, Ay'ın Dünya'ya yakın olduğu zamana denk geliyor. Bu yüzden Ay her zamankinden biraz büyük ve parlak görünecek.", "neOldu": ["Ay, Dünya'nın etrafında tam bir daire çizerek değil, biraz yassı bir yolda dönüyor. Bu yüzden bazen bize daha yakın, bazen daha uzak oluyor. Dolunay, Ay'ın en yakın olduğu zamana denk gelince buna süper ay deniyor.", "Bu ayın dolunayı 24 Kasım Salı günü, Türkiye saatiyle yaklaşık 17.54'te tam haline ulaşacak. Ay doğduğu andan itibaren hava açıksa Türkiye'nin her yerinden çıplak gözle görülebilecek. Bu süper ay, art arda gelecek üç süper aydan ilki; sonrakiler aralık ve ocak aylarında."], "neden": "Süper ay, yılın en küçük görünen dolunayına göre yaklaşık yüzde 14 daha büyük ve yüzde 30 daha parlak görünebiliyor. İzlemek için hiçbir alete gerek yok.", "kelimeler": ["superay", "yorunge"], "soru": "Ay ufukta doğarken daha büyük görünür. Sence bu gerçekten mi büyük, yoksa gözümüz mü bizi yanıltıyor? Salı akşamı kendin dene!", "kaynaklar": [["Politikam: Kasım süper dolunayı", "https://www.politikam.com/kasim-super-dolunayi-24-kasimda-gorulecek-kunduz-dolunayi-turkiye-saatiyle-1754te-tam-evresine-ulasacak"], ["Yeni Asır: Kasım süper ayı", "https://www.yeniasir.com.tr/yasam/2026/11/17/gokyuzunde-gorsel-solen-yasanacak-kasim-super-dolunayi-icin-tarih-belli-oldu-kasim-super-ayi-hangi-gun-saat-kacta-gorulecek"], ["ScienceDaily: Kasım gökyüzü", "https://www.sciencedaily.com/releases/2026/11/261105224547.htm"]]},
 {"id": "superlig12", "bolum": "turkiye", "konu": "Spor", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "yer": {"ad": "Başakşehir, İstanbul", "lat": 41.08, "lon": 28.81}, "baslik": "Süper Lig'de 12. hafta: Galatasaray'dan kulüp rekoru", "ozet": "Galatasaray, Samsunspor'u 2-1 yenerek ligde kendi sahasında üst üste 42. maçını kaybetmeden tamamladı. Bu, kulübün yeni rekoru.", "neOldu": ["Galatasaray dün İstanbul'daki Başakşehir Fatih Terim Stadı'nda Samsunspor'la oynadı. Galatasaray'ın gollerini Lucas Torreira ve Yunus Akgün attı, Samsunspor'un golünü Mohamed Bayo kaydetti. Maç 2-1 bitti.", "Bu sonuçla Galatasaray, ligde kendi sahasında oynadığı maçlarda üst üste 42 kez yenilmemiş oldu. Önceki rekor 41 maçtı. Haftanın bir diğer maçında Kocaelispor ile Fenerbahçe 2-2 berabere kaldı. Haftanın kalan maçları bugün ve yarın oynanıyor."], "neden": "Bir sezon boyunca evinde hiç yenilmemek bile zordur. Rekorlar, takımların uzun süre istikrarlı oynadığını gösteriyor.", "kelimeler": ["istanbul"], "soru": "Sence bir takımın kendi sahasında daha başarılı olmasının sebebi ne olabilir?", "kaynaklar": [["Hürriyet: Galatasaray 2-1 Samsunspor", "https://www.hurriyet.com.tr/sporarena/galatasaray-2-1-samsunspor-super-lig-maci-ozeti-43385826"], ["Fotomaç", "https://www.fotomac.com.tr/galatasaray/2026/11/21/galatasaraydan-samsunspor-karsisinda-tarihi-galibiyet"]]},
 {"id": "voyager", "bolum": "dunya", "konu": "Uzay", "sure": 3, "seviye": "8+", "dosya": "uzay", "tarih": "22 Kasım 2026", "baslik": "Voyager 1 o kadar uzakta ki ışık bile ona bir günde ulaşıyor", "ozet": "1977'de fırlatılan Voyager 1 uzay aracı, 18 Kasım'da Dünya'dan bir ışık günü uzaklığa ulaştı. Bu kadar uzağa giden ilk insan yapımı araç.", "neOldu": ["Işık evrendeki en hızlı şey. Güneş'ten Dünya'ya yaklaşık 8 dakikada geliyor. Voyager 1'e ulaşması ise artık tam bir gün sürüyor. Araç Dünya'dan yaklaşık 25,9 milyar kilometre uzakta. Bu eşiği 18 Kasım'da, Türkiye saatiyle 13.16'da geçti.", "Voyager 1, 5 Eylül 1977'de fırlatıldı ve Jüpiter ile Satürn'ün yanından geçerek Güneş Sistemi'nin dışına çıktı. İçinde, uzaylılar bir gün bulursa diye Dünya'dan sesler, müzikler ve 55 dilde selamlar taşıyan altın kaplama bir plak var.", "Aracın enerjisi her yıl biraz azalıyor, bu yüzden aletlerinin çoğu kapatıldı. NASA'ya göre 14 Kasım'dan beri araçtan bilimsel veri gelmiyor, sadece sinyali alınıyor. Mühendisler sorunun nedenini araştırıyor."], "neden": "Voyager 1, insanların yaptığı en uzak nesne. Ondan gelen bilgiler, Güneş'in etkisinin bittiği ve yıldızlar arası boşluğun başladığı yeri anlamamızı sağladı.", "bizeNe": "Voyager 1 fırlatıldığında bugünkü büyükannelerimiz ve büyükbabalarımız gençti. Dünyanın her yerinden insanlar, Türkiye dahil, bu yolculuğu yaklaşık 50 yıldır izliyor.", "kelimeler": ["nasa", "isikgunu", "gunes"], "soru": "Uzaylılara gönderilecek bir plağa tek bir ses koyabilseydin, hangi sesi seçerdin?", "kaynaklar": [["NASA/ScienceDaily, 20 Kasım 2026", "https://www.sciencedaily.com/releases/2026/11/261120075554.htm"], ["EarthSky, 18 Kasım 2026", "https://earthsky.org/space/voyager-1-1-light-day-from-earth-november-17-18-2026/"], ["ABC7", "https://abc7news.com/story/voyager-1-nasa-probe-70s-reach-light-day-away-earth/20047626/"]]},
 {"id": "hera", "bolum": "dunya", "konu": "Uzay", "sure": 3, "seviye": "10+", "dosya": "uzay", "tarih": "22 Kasım 2026", "baslik": "Avrupa'nın uzay aracı Hera, dört yıl önce çarpılan asteroide vardı", "ozet": "Avrupa Uzay Ajansı'nın Hera aracı, NASA'nın 2022'de bilerek çarptığı küçük asteroidi yakından incelemeye başladı.", "neOldu": ["Uzayda Didymos ve Dimorphos adında iki asteroit var. Büyük olan Didymos yaklaşık 780 metre, onun etrafında dönen küçük Dimorphos ise yaklaşık 151 metre genişliğinde. NASA, 26 Eylül 2022'de DART adlı bir aracı bilerek Dimorphos'a çarptırdı.", "Çarpışma, Dimorphos'un Didymos etrafındaki turunu yaklaşık 33 dakika kısalttı. Bu, beklenenden çok daha büyük bir değişiklikti. Kasım başında oraya ulaşan Hera, şimdi yaklaşık 25-30 kilometre uzaktan asteroitleri inceliyor ve en az altı ay orada kalacak.", "Hera'nın yanında ayakkabı kutusu büyüklüğünde iki küçük uydu var. Bilim insanları bunlardan birini asteroidin üzerine indirmeyi deneyebilir."], "neden": "Günün birinde Dünya'ya doğru gelen bir asteroit fark edilirse, onu yolundan saptırmak gerekebilir. Hera, bu yöntemin işe yarayıp yaramadığını anlamamıza yardım edecek.", "bizeNe": "Bu iki asteroit Dünya için bir tehlike oluşturmuyor. Ama gezegen savunması bütün ülkeleri ilgilendiriyor, Türkiye dahil.", "kelimeler": ["asteroit", "esa", "nasa", "yorunge"], "soru": "Sence bir asteroidin rotasını değiştirmek için çarpmak dışında başka ne yapılabilir?", "kaynaklar": [["DLR (Alman Havacılık ve Uzay Merkezi), 12 Kasım 2026", "https://www.dlr.de/en/latest/news/2026/hera-spots-its-target-a-first-glimpse-into-the-study-of-the-didymos-binary-asteroid-system"], ["AP, 11 Kasım 2026", "https://www.clickorlando.com/tech/2026/11/11/europes-hera-spacecraft-begins-close-inspections-of-an-asteroid-rammed-by-nasa-in-a-2022-test/"]]},
 {"id": "aytugla", "bolum": "dunya", "konu": "Uzay", "sure": 2, "seviye": "8+", "dosya": "uzay", "tarih": "22 Kasım 2026", "yer": {"ad": "Fayetteville, Arkansas, ABD", "lat": 36.07, "lon": -94.17}, "baslik": "Ay tozundan LEGO gibi birbirine geçen tuğlalar yapıldı", "ozet": "ABD'de bir üniversite öğrencisi, Ay toprağının bir benzerini lazerle eriterek birbirine takılan küçük tuğlalar üretti.", "neOldu": ["Ay'da üs kurmak isteyen bilim insanlarının en büyük sorunlarından biri malzeme. Dünya'dan tuğla taşımak çok pahalı. Bu yüzden Ay'ın kendi tozunu kullanmanın yollarını arıyorlar.", "Arkansas Üniversitesi'nden Cole McCallum, öğrenciyken Ay toprağına benzeyen özel bir tozu lazerle katman katman eritip birleştirdi. Hiçbir yapıştırıcı kullanmadan, artı ve H şeklinde, birbirine geçen birkaç santimetrelik parçalar yaptı. Sonuçlar npj Advanced Manufacturing adlı dergide yayımlandı."], "neden": "Ay'daki malzemeyle orada bina yapabilmek, gelecekteki Ay üslerini çok daha kolay ve ucuz hale getirebilir.", "sinir": "Bu tuğlalar gerçek Ay tozuyla değil, ona benzeyen bir tozla yapıldı. Ayrıca henüz yük taşıyacak kadar sağlam değiller. Ay'daki düşük yer çekiminde ve havasız ortamda nasıl davranacakları da denenmedi.", "kelimeler": ["abd"], "soru": "Ay'da bir ev yapsaydın, en çok neye dikkat ederdin?", "kaynaklar": [["ScienceDaily (Arkansas Üniversitesi), 20 Kasım 2026", "https://www.sciencedaily.com/releases/2026/11/261119194525.htm"], ["Popular Science", "https://www.popsci.com/science/3d-printed-lunar-lego-bricks/"]]},
 {"id": "nodul", "bolum": "dunya", "konu": "Doğa", "sure": 3, "seviye": "10+", "dosya": null, "tarih": "22 Kasım 2026", "yer": {"ad": "Clarion-Clipperton Bölgesi, Pasifik Okyanusu", "lat": 12.0, "lon": -130.0}, "baslik": "Okyanusun dibindeki tek bir taşta 245 hayvan yaşıyor", "ozet": "Bilim insanları, Pasifik Okyanusu'nun binlerce metre derinliğindeki metal yumrularının içinde gözle görülmeyecek kadar küçük hayvanlar buldu.", "neOldu": ["Pasifik Okyanusu'nun ortasında, Meksika ile Hawaii arasındaki bir bölgede, deniz tabanı patates büyüklüğünde taş yumrularla kaplı. Bu yumrular 4.000 metreden daha derinde ve oluşmaları milyonlarca yıl sürüyor.", "Almanya'daki Bremen Üniversitesi'ne bağlı MARUM'dan araştırmacılar 244 yumruyu inceledi ve içlerinde toplam 4.139 hayvan buldu. Bir yumrudan tam 245 hayvan çıktı. Bunlar çoğunlukla bir milimetreden küçük solucanlar ve minik kabuklular. Sonuçlar Scientific Reports dergisinde yayımlandı."], "neden": "Bu yumrular nikel, kobalt ve bakır gibi değerli metaller içerdiği için bazı şirketler onları çıkarmak istiyor. Araştırmacılar, yumrular toplanırsa bu küçük canlıların yaşam alanının bir daha geri gelmemek üzere yok olacağı uyarısında bulunuyor.", "sinir": "Araştırma okyanusun tek bir bölgesinden alınan örneklerle yapıldı. Başka bölgelerdeki yumrularda aynı canlıların yaşayıp yaşamadığı henüz bilinmiyor.", "bizeNe": "Telefonların ve elektrikli araçların pillerinde bu tür metaller kullanılıyor. Hepimizin kullandığı cihazlar, okyanusun dibindeki bu tartışmayla bağlantılı.", "kelimeler": ["derindeniz", "pasifik", "almanya"], "soru": "Değerli metallere ihtiyacımız var ama okyanus tabanındaki canlıları da korumak istiyoruz. Sence nasıl bir çözüm bulunabilir?", "kaynaklar": [["MARUM basın açıklaması, 11 Kasım 2026", "https://www.research-in-germany.org/idw-news/en_US/2026/11/2026-11-11_Hidden_Worlds_in_the_Deep_Ocean"], ["Gizmodo, 17 Kasım 2026", "https://gizmodo.com/deep-sea-miners-want-these-rocks-for-their-metals-scientists-found-them-teeming-with-life-2000841181"]]},
 {"id": "balina", "bolum": "dunya", "konu": "Bilim", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "yer": {"ad": "Arequipa, Peru", "lat": -15.5, "lon": -74.7}, "baslik": "6 milyon yıl önce yaşamış balinanın yüzü bambaşka: Burun delikleri tek tarafta", "ozet": "Peru'da bulunan bir fosil, burun delikleri kafasının sol tarafına kaymış küçük bir balinaya ait. Bilim insanları bunun balinalarda bilinen en çarpık yüz olduğunu söylüyor.", "neOldu": ["Scaphokogia huachafo adı verilen bu balina yaklaşık 2,7 metre uzunluğundaydı ve 6 milyon yıl kadar önce yaşadı. Kafatası 1990'larda Peru'nun güneyinde bulunmuştu, ama ancak şimdi ayrıntılı olarak incelendi.", "Balinalar burun delikleriyle, yani başlarının üstündeki deliklerle nefes alır. Bu balinanın iki burun deliği de kafasının soluna kaymıştı ve biri diğerinden çok daha büyüktü. İsviçre'deki Zürih Üniversitesi'nin öncülük ettiği araştırma Communications Biology dergisinde yayımlandı."], "neden": "Bilim insanları, bu tuhaf yapının balinanın deniz tabanında yiyecek aramasına yardım etmiş olabileceğini düşünüyor. Fosiller, hayvanların çevrelerine nasıl uyum sağladığını gösteriyor.", "sinir": "Bu balinanın nasıl yaşadığına dair bilgiler tek bir kafatasından çıkarıldı. Balinanın deniz tabanında beslendiği fikri şimdilik güçlü bir tahmin, kesin bir bilgi değil.", "bizeNe": "Bugün Türkiye'nin denizlerinde de yunuslar ve bazen balinalar yaşıyor. Onların atalarının nasıl değiştiğini anlamak, bugünkü türleri korumamıza da yardım ediyor.", "kelimeler": ["fosil", "peru"], "soru": "Sence bir hayvanın yüzünün iki tarafının farklı olması ona ne gibi faydalar sağlayabilir?", "kaynaklar": [["Zürih Üniversitesi / EurekAlert, 9 Kasım 2026", "https://www.eurekalert.org/news-releases/1151087"], ["Sci.News", "https://www.sci.news/paleontology/scaphokogia-huachafo-15184.html"]]},
 {"id": "varilgoz", "bolum": "dunya", "konu": "Doğa", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "22 Kasım 2026", "yer": {"ad": "Monterey Kanyonu, Kaliforniya, ABD", "lat": 36.7, "lon": -122.1}, "baslik": "Kafası şeffaf balık ilk kez bu kadar net görüntülendi", "ozet": "ABD'de bir deniz araştırma robotu, kafasının içi görünen ve gözlerini kafasının içinde döndürebilen nadir bir balığı çok yüksek çözünürlükte kaydetti.", "neOldu": ["Varilgöz balığı adı verilen bu balık, ışığın çok az ulaştığı derinliklerde yaşıyor. Kafası cam gibi şeffaf. Yeşil renkli gözleri ise kafanın içinde ve yukarıya bakıyor.", "Monterey Körfezi Akvaryumu Araştırma Enstitüsü (MBARI), 20 Ekim'de Kaliforniya açıklarında yaklaşık 600 metre derinlikte bu balığı Doc Ricketts adlı uzaktan kumandalı robotuyla görüntüledi. Enstitü bu balığı yıllardır sadece 11 kez görebildi; 4K kalitesinde ilk kez çekti."], "neden": "Balık, yukarıdan geçen bir avın gölgesini görünce gözlerini kafasının içinde öne doğru çevirebiliyor. Bu görüntüler, derin denizde yaşayan canlıların zor koşullara nasıl uyum sağladığını gösteriyor.", "bizeNe": "Okyanusların derin kısımlarının çok azı keşfedildi. Bu tür keşifler, dünyanın bize hâlâ ne kadar çok sürpriz sakladığını hatırlatıyor.", "kelimeler": ["derindeniz", "abd"], "soru": "Kafan şeffaf olsaydı ve gözlerini içinde döndürebilseydin, nereye bakardın?", "kaynaklar": [["Popular Science", "https://www.popsci.com/environment/barreleye-fish-4k-video/"], ["FOX Weather", "https://www.foxweather.com/earth-space/rarely-seen-deep-sea-fish-barreleye-fish-california-video"], ["ScienceDaily, 17 Kasım 2026", "https://www.sciencedaily.com/releases/2026/11/261117033917.htm"]]},
 {"id": "yesilarabistan", "bolum": "dunya", "konu": "Arkeoloji", "sure": 3, "seviye": "10+", "dosya": "iklim", "tarih": "22 Kasım 2026", "yer": {"ad": "Rub' al-Halî çölü, Suudi Arabistan", "lat": 20.0, "lon": 50.0}, "baslik": "Bugünkü çölde bir zamanlar göl ve su aygırları vardı", "ozet": "Suudi Arabistan'ın kum çölünde yapılan kazılar, 125 bin yıl önce burada büyük bir göl olduğunu ve çevresinde su aygırlarının yaşadığını gösterdi.", "neOldu": ["Arabistan Yarımadası'nın güneyindeki Rub' al-Halî, dünyanın en büyük kum çöllerinden biri. Ama bilim insanları, Uruq Aljelibah adlı bir yerde yaklaşık 125 bin yıl önce 340 kilometrekare büyüklüğünde ve 29 metreye kadar derinliğinde bir göl olduğunu buldu.", "Göl kıyısında su aygırı, yaban sığırı, devekuşu, ceylan ve oriks gibi hayvanların 500'den fazla fosili ve 5.500'den fazla taş alet bulundu. Çevrede palmiyeler ve sazlıklar vardı. Araştırma Science dergisinde 12 Kasım'da yayımlandı."], "neden": "Dünya'nın iklimi geçmişte de çok değişti. Bir zamanlar yeşil olan yerler çöle dönüşebiliyor. Bu da insanların ve hayvanların tarih boyunca neden göç ettiğini anlamamıza yardım ediyor.", "sinir": "Taş aletler kumun yüzeyinde bulundu ve yaşları doğrudan ölçülmedi. Bölgede insan kemiği bulunmadığı için bu aletleri tam olarak kimlerin yaptığı da kesin değil.", "bizeNe": "Anadolu'nun iklimi de geçmişte çok değişti. Konya Ovası'nın bir bölümü de çok eskiden büyük bir göldü.", "kelimeler": ["suudiarabistan", "arkeoloji", "fosil"], "soru": "Yaşadığın yer 125 bin yıl önce nasıl görünüyordu sence? Hangi hayvanlar yaşıyordu?", "kaynaklar": [["Live Science, 12 Kasım 2026", "https://www.livescience.com/archaeology/middle-east/125-000-year-old-poisoned-stone-points-discovered-on-shore-of-ancient-lake-in-saudi-arabia"], ["Smithsonian Magazine", "https://www.smithsonianmag.com/smart-news/ancient-humans-may-have-hunted-hippos-with-poisoned-spear-tips-on-the-arabian-peninsula-125000-years-ago-180989880/"]]}
