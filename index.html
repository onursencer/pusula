<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pusula Çocuk Gündemi</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/js/jsvectormap.min.js" integrity="sha384-dUo4VnkPwa5iJ/udOYY1SRDya6+2CVXYRfing32kyXbeB6HePV/YmJ3EPPvYz/Sb" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js" integrity="sha384-QCoiowLYPphJpiHouJIJOUCcg6AxqnLAAyEjkZnJ7RQCpC3YY1kEX0PaOant/8kx" crossorigin="anonymous"></script>
<style>
/* Layout: gazete masası — üstte pusula başlığı, solda günün haberi, sağda akış; her haber aynı iskelet (ne oldu / neden önemli / bize ne / kelime / soru) */
:root{--paper:#D9F3F0;--surface:#FFFFFF;--ink:#0F2A2E;--muted:#4F6A6D;--line:#B9E0DC;--sun:#FFC93C;--sun-ink:#0F2A2E;--tr:#D6455D;--tr-soft:#FCE7EB;--world:#1F6FB2;--world-soft:#E2EEF8;--lead:#08858A;--lead-fg:#FFFFFF;--lead-accent:#FFD45C;--focus:#08858A;color-scheme:light;--f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;--f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;--s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s5:1.5rem;--s6:2rem;--s7:3rem;--r:14px}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:var(--s4);padding-block:var(--s3)}
.logo{display:flex;align-items:center;gap:var(--s2);text-decoration:none}
.logo svg{width:38px;height:38px;flex:none}
.logo b{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em}
.logo small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1}
.date{margin-left:auto;font-size:.85rem;color:var(--muted);text-align:right}
nav{overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav ul{display:flex;gap:var(--s1);list-style:none;margin:0;padding:0 0 var(--s2);white-space:nowrap}
nav a{display:block;text-decoration:none;padding:.4rem .85rem;border-radius:999px;font-weight:700;font-size:.95rem;color:var(--muted)}
nav a:hover{color:var(--ink);background:var(--paper)}
nav a[aria-current="page"]{background:var(--lead);color:var(--lead-fg)}

main{padding-block:var(--s6) var(--s7)}
.proto{font-size:.85rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:.5rem .8rem;margin-bottom:var(--s5)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .6rem;border-radius:999px}
.chip.turkiye{background:var(--tr-soft);color:var(--tr)}
.chip.dunya{background:var(--world-soft);color:var(--world)}
.chip.konu{background:transparent;color:var(--muted);padding-inline:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);font-size:.85rem;color:var(--muted)}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:var(--s6);align-items:start}
.lead{background:var(--lead);color:var(--lead-fg);border-radius:22px;padding:var(--s6);position:relative;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;gap:var(--s4)}
.lead .rose{position:absolute;right:-60px;top:-60px;width:260px;height:260px;opacity:.13;pointer-events:none}
.lead .eyebrow{font-family:var(--f-display);font-weight:700;color:var(--lead-accent);letter-spacing:.08em;text-transform:uppercase;font-size:.85rem}
.lead h1{font-size:clamp(2rem,4.5vw,3.1rem);font-weight:800;letter-spacing:-.02em;max-width:18ch}
.lead p{font-size:1.1rem;max-width:52ch;opacity:.92}
.lead .go{align-self:flex-start;background:var(--lead-accent);color:#14213D;font-weight:700;padding:.55rem 1.1rem;border-radius:999px}
.lead:hover .go{transform:translateX(3px)}
.go{transition:transform .2s}
.side h2,.sec-title{font-size:1.35rem;font-weight:800;margin-bottom:var(--s4);display:flex;align-items:baseline;gap:var(--s2)}
.sec-title small{font-family:var(--f-body);font-weight:400;font-size:.9rem;color:var(--muted)}

.feed{display:flex;flex-direction:column;gap:var(--s3)}
.item{display:grid;grid-template-columns:6px minmax(0,1fr);gap:var(--s3);text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4)}
.item:hover{border-color:var(--muted)}
.item .stripe{border-radius:6px}
.item.turkiye .stripe{background:var(--tr)} .item.dunya .stripe{background:var(--world)}
.item h3{font-size:1.12rem;font-weight:700;margin-block:.3rem .25rem}
.item p{font-size:.95rem;color:var(--muted)}

.row{margin-top:var(--s7)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--s4)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);text-decoration:none;display:flex;flex-direction:column;gap:var(--s2)}
.card:hover{border-color:var(--muted)}
.card h3{font-size:1.15rem;font-weight:700}
.card p{color:var(--muted);font-size:.95rem}
.card .count{margin-top:auto;font-size:.85rem;font-weight:700;color:var(--ink)}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--s4)}
.qbox{background:var(--sun);color:var(--sun-ink);border-radius:var(--r);padding:var(--s5);text-decoration:none;display:flex;flex-direction:column;gap:var(--s2)}
.qbox h3{font-size:1.25rem;font-weight:800}
.qbox.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

/* article */
.article{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s5)}
.back{font-weight:700;text-decoration:none;color:var(--muted);font-size:.95rem}
.back:hover{color:var(--ink)}
.article h1{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:800;letter-spacing:-.015em}
.article .ozet{font-size:1.2rem;color:var(--muted)}
.block h2{font-size:1.25rem;font-weight:800;margin-bottom:var(--s2)}
.block p+p{margin-top:var(--s3)}
.box{border-radius:var(--r);padding:var(--s5)}
.box.why{background:var(--surface);border:1px solid var(--line)}
.box.us{background:var(--world-soft)}
.box.us h2{color:var(--world)}
.box.ask{background:var(--sun);color:var(--sun-ink)}
.box.limit{background:var(--surface);border:2px dashed var(--lead)}
.box.limit h2{color:var(--lead)}
.words{display:flex;flex-wrap:wrap;gap:var(--s2)}
.word{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.35rem .7rem;font-weight:700;text-decoration:none;font-size:.95rem}
.word:hover{border-color:var(--ink)}
.where{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s4);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) var(--s5)}
.where svg{width:64px;height:64px}
.where b{font-family:var(--f-display);font-size:1.15rem}
.where .nums{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem}
.src{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:var(--s3)}

/* sözlük */
.search{width:100%;max-width:420px;font:inherit;padding:.65rem .9rem;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:var(--s5)}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s3)}
.term{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) var(--s5)}
.term h3{font-size:1.1rem;font-weight:800;margin-bottom:.2rem}
.term p{font-size:.95rem}
.term .rel{font-size:.82rem;color:var(--muted);margin-top:var(--s2)}
.term:target{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}

/* sorular */
.qa{display:flex;flex-direction:column;gap:var(--s3);max-width:760px}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) var(--s5)}
summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.1rem;list-style:none;display:flex;gap:var(--s3);justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--muted)}
details[open] summary::after{content:"−"}
details .who{font-size:.85rem;color:var(--muted);margin-top:var(--s1)}
details .ans{margin-top:var(--s3)}
form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);max-width:760px;margin-top:var(--s6)}
label{font-weight:700;font-size:.95rem}
input[type=text],select,textarea{font:inherit;width:100%;padding:.6rem .8rem;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--s3)}
.check{display:flex;gap:var(--s2);align-items:flex-start;font-weight:400}
.check input{margin-top:.35rem}
.btn{align-self:flex-start;font:inherit;font-weight:700;border:0;border-radius:999px;padding:.6rem 1.3rem;background:var(--ink);color:var(--surface);cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:.92rem;padding:.6rem .8rem;border-radius:10px;background:var(--world-soft);color:var(--ink)}

/* quiz */
.quiz{max-width:640px;display:flex;flex-direction:column;gap:var(--s4)}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.progress i.ok{background:var(--world)} .progress i.no{background:var(--tr)} .progress i.now{background:var(--sun)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.qcard h2{font-size:1.35rem;font-weight:800}
.opt{font:inherit;text-align:left;padding:.75rem 1rem;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--world);background:var(--world-soft)}
.opt.wrong{border-color:var(--tr);background:var(--tr-soft)}
.opt:disabled{cursor:default}
.expl{font-size:.95rem;color:var(--muted)}
.score{font-family:var(--f-display);font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums}

/* ilkeler */
.rules{max-width:760px;display:flex;flex-direction:column;gap:var(--s4);counter-reset:r}
.rule{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:var(--s3)}
.rule::before{counter-increment:r;content:counter(r);font-family:var(--f-display);font-weight:800;font-size:1.3rem;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center}
.rule h3{font-size:1.1rem;font-weight:800;margin-bottom:.15rem}
.rule p{color:var(--muted)}

.intro{max-width:62ch;color:var(--muted);margin-bottom:var(--s5);font-size:1.05rem}
.page-h{font-size:clamp(1.8rem,4vw,2.4rem);font-weight:800;margin-bottom:var(--s2)}

footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-block:var(--s5);display:flex;flex-wrap:wrap;gap:var(--s3) var(--s6);font-size:.88rem;color:var(--muted)}
footer b{color:var(--ink);font-family:var(--f-display)}

/* kavram bağlantıları ve kart */
.k{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-bottom:2px dotted var(--lead);text-align:inherit;line-height:inherit}
.k:hover{background:var(--paper);border-bottom-style:solid}
.word.k{border:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:700}
.word.k:hover{border-color:var(--lead);background:var(--surface)}
#kart{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 32px));max-height:min(78vh,640px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(15,42,46,.22);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
#kart .top{display:flex;align-items:flex-start;gap:var(--s3)}
#kart .tur{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lead)}
#kart h2{font-size:1.45rem;font-weight:800}
#kart .x{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:1.2rem;line-height:1;cursor:pointer}
#kart dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.25rem var(--s4);margin:0;font-size:.95rem;background:var(--paper);border-radius:12px;padding:var(--s3) var(--s4)}
#kart dt{color:var(--muted)} #kart dd{margin:0;font-weight:700}
#kart .map{height:170px;border-radius:12px;background:var(--world-soft);overflow:hidden}
#kart .rel{font-size:.9rem;color:var(--muted)}
#kart .rel a{color:var(--ink)}
#kart .more{font-size:.9rem;font-weight:700;color:var(--lead)}
.jvm-container{position:relative;overflow:hidden;height:100%;width:100%;touch-action:none}
.jvm-tooltip{display:none!important}
/* arama */
.find{margin-left:var(--s4);flex:0 1 260px;min-width:0}
.find input{width:100%;font:inherit;font-size:.95rem;padding:.5rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.res h2{font-size:1.2rem;font-weight:800;margin:var(--s5) 0 var(--s3)}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) var(--s5);text-align:left;font:inherit;color:inherit;width:100%;cursor:pointer;display:block}
.hit:hover{border-color:var(--lead)}
.hit b{font-family:var(--f-display);font-size:1.1rem}
.hit small{display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lead)}
.hit span{display:block;color:var(--muted);font-size:.95rem}
.term .tur{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lead)}
.term button.k{border:0;font-family:var(--f-display);font-weight:800;font-size:1.1rem;text-align:left}
.tip{font-size:.9rem;color:var(--muted)}

@media (max-width:820px){
  .home{grid-template-columns:minmax(0,1fr)}
  .lead{padding:var(--s5)}
  .two{grid-template-columns:minmax(0,1fr)}
  .date{display:none}
  .find{margin-left:auto;flex-basis:170px}
  #kart{right:0;left:0;bottom:0;width:100%;max-height:72vh;border-radius:18px 18px 0 0;padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom,0px));padding-left:max(var(--s5),env(safe-area-inset-left,0px));padding-right:max(var(--s5),env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="#ana" aria-label="Pusula ana sayfa">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--lead)"/><circle cx="20" cy="20" r="14" fill="none" stroke="var(--surface)" stroke-width="1.2" opacity=".5"/><path d="M20 5 L24 20 L20 35 L16 20 Z" fill="var(--surface)"/><path d="M20 5 L24 20 L16 20 Z" fill="var(--sun)"/><circle cx="20" cy="20" r="2.2" fill="var(--lead)"/></svg>
        <span><b>Pusula</b><small>Dünyayı birlikte anlayalım</small></span>

      <div class="date" id="today"></div>

<main class="wrap" id="view" tabindex="-1"></main>

</footer>

<script>
const IST = {lat:41.01, lon:28.98};

const GUNCELLEME = "25 Kasım 2026";

const NAV = [
  ["ana","Ana sayfa"],["turkiye","Türkiye"],["dunya","Dünya"],["dosyalar","Dosyalar"],
  ["sozluk","Sözlük"],["quiz","Haftanın Quizi"],["ilkeler","İlkelerimiz"]
];

 {"id": "shenzhou24", "bolum": "dunya", "konu": "Uzay", "sure": 3, "seviye": "8+", "dosya": "uzay", "tarih": "25 Kasım 2026", "yer": {"ad": "Jiuquan Uydu Fırlatma Merkezi, Çin", "lat": 40.96, "lon": 100.29}, "baslik": "Çin'in uzay istasyonuna ilk kez yabancı bir astronot gidiyor: Pakistanlı pilot yolda", "ozet": "Çin'in Shenzhou-24 uzay aracı bu sabah üç kişilik ekibiyle fırlatıldı. Ekipteki Pakistanlı Muhammad Zeeshan Ali, Çin'in Tiangong uzay istasyonuna giden ilk yabancı astronot olacak.", "neOldu": ["Araç, Türkiye saatiyle sabah 03.18'de Çin'in kuzeybatısındaki Jiuquan Uydu Fırlatma Merkezi'nden havalandı. Ekipte Çinli komutan Tang Hongbo ve mühendis Wu Yi'nin yanında 40 yaşındaki Pakistanlı pilot Muhammad Zeeshan Ali var. Aracın, yörüngeye ulaştıktan birkaç saat sonra istasyona kendi kendine kenetlenmesi planlanıyor.", "Zeeshan Ali böylece uzaya çıkan ilk Pakistanlı oldu. İstasyonda deneyler yapacak ve birkaç gün sonra Dünya'ya dönecek. Kaynaklarda kalış süresi 5 ile 10 gün arasında veriliyor."], "neden": "Tiangong, Çin'in kendi kurduğu uzay istasyonu ve bugüne kadar orada yalnızca Çinli astronotlar çalıştı. İlk yabancı konuğun gelmesi, istasyonun başka ülkelerin astronotlarına da açılmaya başladığını gösteriyor.", "bizeNe": "Türkiye'nin ilk astronotu Alper Gezeravcı da 2024'te Uluslararası Uzay İstasyonu'na giderek ülkesi için benzer bir ilki yaşamıştı. Birçok ülke astronotlarını başka ülkelerin araçlarıyla uzaya gönderiyor.", "kelimeler": ["cin", "pakistan", "tiangong", "astronot", "yorunge"], "soru": "Bir uzay istasyonunda bir hafta kalsaydın, yanına hangi üç eşyayı alırdın? Neden?", "kaynaklar": [["RTÉ (Reuters), 25 Kasım 2026", "https://www.rte.ie/news/world/2026/1125/1600554-china-space-world/"], ["The Japan Times, 25 Kasım 2026", "https://www.japantimes.co.jp/news/2026/11/25/asia-pacific/china-shenzhou-24-space-pakistan/"], ["Nature: Pakistanlı astronot Tiangong yolunda", "https://www.nature.com/articles/d41586-026-03829-y"]]},

 {"id": "eseriade", "bolum": "turkiye", "konu": "Kültür", "sure": 3, "seviye": "8+", "dosya": null, "tarih": "25 Kasım 2026", "yer": {"ad": "İstanbul Arkeoloji Müzeleri", "lat": 41.01, "lon": 28.98}, "baslik": "Yurt dışına kaçırılan 100 tarihi eser Türkiye'ye geri döndü", "ozet": "Anadolu'dan yıllar önce yasa dışı yollarla çıkarılan 100 tarihi eser ABD'den Türkiye'ye getirildi. Eserler İstanbul Arkeoloji Müzeleri'nde tanıtıldı.", "neOldu": ["Kültür ve Turizm Bakanlığı, ABD'den geri gelen eserleri İstanbul Arkeoloji Müzeleri'ndeki bir toplantıyla tanıttı. Aralarında tiyatro maskeleri ve küçük tanrıça heykelleri gibi parçalar var. İadede ABD'deki New York savcılığıyla yapılan iş birliği de rol oynadı.", "En dikkat çeken parçalar, Burdur'daki Bubon Antik Kenti'nden çıkarılmış Roma dönemi bronz heykeller. Bu heykeller 1960'larda izinsiz kazılarla yurt dışına götürülmüştü. Uzmanlar eski kazı kayıtlarını, üç boyutlu taramaları ve laboratuvar analizlerini kullanarak heykellerin Bubon'dan geldiğini gösterdi. Örneğin bir heykelin ayağındaki metal parçanın, Bubon'daki bir kaidenin yuvasına tam oturduğu bilgisayarda kanıtlandı."], "neden": "Tarihi eserler, bulundukları yerle birlikte anlam kazanıyor. Bir eserin nereden geldiği bilinirse, orada yaşamış insanlar hakkında çok daha fazlası öğrenilebiliyor. Bu yüzden ülkeler kaçırılan eserlerini geri almak için yıllarca uğraşıyor.", "kelimeler": ["abd", "bubon", "arkeoloji", "istanbul"], "soru": "Bir müzede gördüğün eserin hikâyesini merak etsen, nereden geldiğini öğrenmek için neler yapardın?", "kaynaklar": [["Euronews Türkçe, 24 Kasım 2026", "https://tr.euronews.com/2026/11/24/anadoludan-kacirilan-100-tarihi-eser-abdden-turkiyeye-dondu"], ["Takvim, 24 Kasım 2026", "https://www.takvim.com.tr/kultur-sanat/2026/11/24/abdden-100-tarihi-eser-turkiyeye-iade-edildi"], ["Başka Gazete", "https://www.baskagazete.com/haber/abd-100-kultur-varligini-turkiye-ye-iade-etti-257938.html"], ["Mürekkep Haber: Bubon heykelleri", "https://www.murekkep  {"id": "ogretmenatama", "bolum": "turkiye", "konu": "Okul", "sure": 2, "seviye": "10+", "dosya": null, "tarih": "25 Kasım 2026", "baslik": "30 bin yeni öğretmen ataması açıklandı: Yarısı 2026'da, yarısı 2027'de", "ozet": "Öğretmenler Günü'nde düzenlenen bir programda, 2026 ve 2027 yıllarında toplam 30 bin öğretmen ataması yapılacağı açıklandı.", "neOldu": ["Açıklamayı Cumhurbaşkanı Erdoğan, 24 Kasım akşamı yapılan Öğretmenlere Saygı Gecesi'nde yaptı. Buna göre 15 bin öğretmen 2026 Akademi Giriş Sınavı sonuçlarına göre, 15 bin öğretmen de 2027'de benzer bir sınavla atanacak. Öğretmen adaylarının gelecek eylül ayında Milli Eğitim Akademisi'nde eğitime başlaması bekleniyor.", "Milli Eğitim Bakanlığı'nın bu hafta hangi branşlardan kaç öğretmen alınacağını gösteren duyuruyu yapması bekleniyor. Başvuru koşulları, illere dağılım ve kesin takvim gibi ayrıntılar henüz açıklanmadı."], "neden": "Türkiye'de devlet okullarındaki öğretmenler sınav ve atama sistemiyle göreve başlıyor. Milli Eğitim Akademisi, öğretmen adaylarının sınıfa girmeden önce bir süre eğitim almasını sağlamak için kuruldu.", "kelimeler": ["meb", "mea"], "soru": "Sen öğretmen olsaydın hangi dersi anlatmak isterdin? Neden?", "kaynaklar": [["Euronews Türkçe, 24 Kasım 2026", "https://tr.euronews.com/2026/11/24/erdogandan-2026-ve-2027-doneminde-30-bin-ogretmene-atama-mujdesi"], ["Hürriyet", "https://www.hurriyet.com.tr/egitim/cumhurbaskani-erdogan-30-bin-ogretmen-atamasi-yapilacak-43389850"], ["Yeni Şafak", "https://www.yenisafak.com/gundem/30-bin-ogretmene-atama-mujdesi-4876250"]]},
 {"id": "kar25", "bolum": "turkiye", "konu": "Hava", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "25 Kasım 2026", "baslik": "Kış kapıda: Birçok ilde kar bekleniyor, sıcaklıklar düşüyor", "ozet": "Meteoroloji tahminlerine göre bugün Doğu Anadolu ve Karadeniz'deki birçok ilde kar yağışı bekleniyor. Sıcaklıkların yurdun büyük bölümünde 6 ila 10 derece düşmesi öngörülüyor.", "neOldu": ["Kar beklenen iller arasında Erzurum, Kars, Ardahan, Ağrı, Sivas, Kastamonu ve Artvin var. Meteoroloji Genel Müdürlüğü ayrıca 24 ve 25 Kasım için 19 ilde kuvvetli yağış ve kar nedeniyle sarı kodlu uyarı yaptı. Rize, Trabzon ve Samsun gibi Karadeniz illeri de uyarı listesinde.", "Yetkililer buzlanma ve ulaşımda aksama olabileceği konusunda uyarıyor. İstanbul ve Ankara'nın şehir merkezlerinde ise bu iki gün kar beklenmiyor."], "neden": "Kar, dağlarda biriken bir su deposu gibi çalışıyor; baharda eriyerek derelere ve barajlara su taşıyor. Yollarda buzlanmaya da yol açabildiği için karlı günlerde kalın giyinmek ve dikkatli yürümek önemli.", "kelimeler": ["meteoroloji", "sarikod", "erzurum"], "soru": "Kar tanelerinin her birinin farklı olduğu söylenir. Bir dahaki kar yağışında koyu renk bir kumaşa düşen kar tanelerine büyüteçle bakmaya ne dersin?", "kaynaklar": [["Ulusal Kanal", "https://www.ulusal.com.tr/yurt/kar-yagisini-bekleyenlere-mujde-meteoroloji-25-kasim-2026-carsamba-gunu-kar-yagacak-12-ili-acikladi-15105438"], ["Politikam: 19 ilde sarı kod", "https://www.politikam.com/meteorolojiden-19-il-icin-sari-kodlu-uyari-24-ve-25-kasimda-kuvvetli-yagis-gok-gurultulu-saganak-ve-kar-bekleniyor"], ["Milli Gazete", "https://www.milligazete.com.tr/24-25-kasimda-hangi-illere-kar-yagacak-istanbul-ve-ankaraya-kar-geliyor-mu-meteorolojinin-son-hava-durumu-tahmini"], ["Bölge Gündemi: Sıcaklık düşüşü", "https://www.bolgegundemi.com/spor/dikkat-kis-geliyor-19-il-icin-sari-kodlu-kritik-hava-uyarisi-243511.html"]]},
 {"id": "tastepeler", "bolum": "turkiye", "konu": "Arkeoloji", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "25 Kasım 2026", "yer": {"ad": "Millet Kütüphanesi, Ankara", "lat": 39.93, "lon": 32.8}, "baslik": "Göbeklitepe ve Karahantepe'den 34 eser Ankara'da sergilendi", "ozet": "Şanlıurfa'daki Taş Tepeler kazılarında bulunan 34 eser, Ankara'daki Millet Kütüphanesi'nde ziyaretçilerle buluştu. Aralarında bu yıl bulunan dev bir akbaba başı da var.", "neOldu": ["Eserler Göbeklitepe, Karahantepe, Sefertepe ve Sayburç'taki kazılardan çıkarıldı. Yaklaşık 12 bin ile 9 bin yıl öncesine, yani insanların henüz çanak çömlek yapmadığı bir döneme ait. Sergi kasım ortasında açıldı.", "En çok dikkat çeken parçalardan biri, 2026 kazılarında bulunan büyük bir akbaba başı heykeli. Karahantepe'de aynı taş kabın içinde bulunan üç küçük hayvan heykelciği de sergideydi. Kazı başkanı Prof. Dr. Necmi Karul, bu heykelciklerin bir hikâye anlatıyor olabileceğini düşünüyor."], "neden": "Taş Tepeler, insanların yerleşik hayata geçtiği dönemi anlamak için dünyanın en önemli yerlerinden biri. Bu buluntular, o dönemin insanlarının sanatını ve inançlarını anlamaya yardım ediyor.", "kelimeler": ["gobeklitepe", "neolitik", "sanliurfa", "ankara", "arkeoloji"], "soru": "12 bin yıl önce yaşasaydın, taşa hangi hayvanı oyardın? Neden?", "kaynaklar": [["Euronews Türkçe, 23 Kasım 2026", "https://tr.euronews.com/2026/11/23/gobeklitepe-ve-karahantepeden-34-eser-ilk-kez-sergide"], ["Hibya Haber Ajansı", "https://hibya.com/tas-tepeler-kazilarindan-cikarilan-34-eser-ankarada-sergilendi-1102765"], ["Haberport", "https://www.haberport.com/haber/ankarada-34-tas-tepeler-eseri-sergilendi-karahantepeden-akbaba-basi-ve-nadir-figurinler/74569"], ["Başkent Postası: Prof. Dr. Necmi Karul", "https://baskentpostasi.com/prof-dr-necmi-karul-karahantepede-bir-hikayenin-heykellerle-anlatildigi-en-eski-oerneklerden-birini-bulmus-olabiliriz"]]},
 {"id": "romanteleskop", "bolum": "dunya", "konu": "Uzay", "sure": 2, "seviye": "8+", "dosya": "uzay", "tarih": "25 Kasım 2026", "yer": {"ad": "San Francisco, ABD", "lat": 37.77, "lon": -122.42}, "baslik": "NASA'nın yeni teleskobu Roman, ilk fotoğraflarını 7 Aralık'ta gösterecek", "ozet": "NASA, Nancy Grace Roman Uzay Teleskobu'nun ilk gerçek görüntülerini 7 Aralık'ta ABD'nin San Francisco kentindeki büyük bir bilim toplantısında paylaşacak.", "neOldu": ["Roman teleskobu, gökyüzünün çok geniş bölümlerini tek seferde görüntüleyebilecek şekilde tasarlandı. Görüntüler, Amerikan Jeofizik Birliği'nin San Francisco'daki yıllık toplantısında canlı yayınla gösterilecek. Yayın Türkiye saatiyle 7 Aralık gecesi 23.30'da başlayacak.", "NASA başlangıçta ilk görüntüleri 2027'nin başında paylaşmayı planlıyordu; yani takvim öne alındı. Eylül ayında yayımlanan ilk fotoğraf ise yalnızca bir deneme görüntüsüydü."], "neden": "Teleskop, adını NASA'nın ilk baş gökbilimcisi Nancy Grace Roman'dan alıyor. Bilim insanları onu karanlık madde gibi evrenin gizemlerini ve uzak gezegenleri araştırmak için kullanacak.", "bizeNe": "Teleskop görüntüleri internetten herkesle paylaşılıyor. 7 Aralık'tan sonra Roman'ın fotoğraflarına Türkiye'den de bakabilir, gökyüzünün ne kadar kalabalık olduğunu kendi gözlerinle görebilirsin.", "kelimeler": ["nasa", "teleskop", "karanlikmadde", "abd"], "soru": "Dev bir teleskobu bir gece için yönetebilseydin, ilk olarak gökyüzünün neresine bakardın?", "kaynaklar": [["AGU Newsroom", "https://news.agu.org/press-release/first-images-from-nancy-grace-roman-space-telescope-to-premiere-at-2026-agu-annual-meeting-in-san-francisco/"], ["NASA Science", "https://science.nasa.gov/astrophysics/programs/physics-of-the-cosmos/community/romans-first-images-to-be-revealed/"], ["EurekAlert", "https://www.eurekalert.org/news-releases/1153114"], ["Starlust", "https://starlust.org/nasa-to-unveil-first-images-by-nancy-grace-roman-telescope-on-december-7-heres-how-to-tune-in-live/"]]},
 {"id": "dunyakarbonu", "bolum": "dunya", "konu": "Bilim", "sure": 3, "seviye": "10+", "dosya": null, "tarih": "25 Kasım 2026", "yer": {"ad": "Kilauea Yanardağı, Hawaii, ABD", "lat": 19.41, "lon": -155.29}, "baslik": "Dünya'daki karbonun bir kısmı göktaşlarından mı geldi? Hawaii'nin kayaları ipucu veriyor", "ozet": "ABD'li bilim insanları, Hawaii'deki volkanik kayalarda göktaşlarındakine benzeyen bir karbon izi buldu. Araştırmacılar bu karbonun Dünya'nın çekirdeğinden yükselmiş olabileceğini düşünüyor.", "neOldu": ["Karbon, canlıların yapı taşlarından biri. Columbia Üniversitesi'nden Yves Moussallam'ın yönettiği ekip, Hawaii'deki Kilauea yanardağından ve çevresinden alınan kayaları inceledi. Kayalardaki karbonun, gezegenin üst katmanlarındaki karbondan farklı bir yapıda olduğunu gördüler.", "Bu karbonun izi, karbonca zengin bir göktaşı türüne benziyordu. Ekibe göre Dünya oluşurken göktaşlarıyla gelen karbonun bir kısmı gezegenin en derinindeki çekirdeğe yerleşmiş olabilir. Hawaii'nin altından yükselen sıcak kaya akıntıları da bu karbonu yüzeye taşıyor olabilir. Çalışma PNAS dergisinde yayımlandı."], "neden": "Yaşam için gerekli karbonun Dünya'ya nasıl geldiği, bilimin büyük sorularından biri. Bu araştırma, cevabın bir bölümünün gezegenin en derin yerinde saklı olabileceğini düşündürüyor.", "sinir": "Bilim insanları çekirdekten doğrudan örnek alamıyor; çekirdek bağlantısı bir yorum. Araştırma yalnızca Hawaii'deki kayalarla yapıldı. Ekibin lideri de kesin bir sonuç için yeni ölçümler gerektiğini söylüyor.", "bizeNe": "Türkiye'de de Kapadokya'nın peri bacaları ve Nemrut gibi dağlar, eski yanardağların izlerini taşıyor. Yanardağ kayaları, bilim insanlarına gezegenin içini anlamak için bir pencere açıyor.", "kelimeler": ["goktasi", "cekirdek", "hawaii", "abd"], "soru": "Gezegenimizin merkezine bir yolculuk yapabilseydin, yolda neler görmeyi beklerdin?", "kaynaklar": [["Columbia Climate School, 18 Kasım 2026", "https://news.climate.columbia.edu/2026/11/18/a-new-origin-story-for-earths-carbon/"], ["ScienceDaily", "https://www.sciencedaily.com/releases/2026/11/261123005336.htm"], ["Yahoo News: Hawaii kayalarındaki ipuçları", "https://www.yahoo.com/news/science/articles/carbon-cosmos-us-scientists-clues-151616786.html"], ["SciTechDaily", "https://scitechdaily.com/ancient-meteorites-may-have-delivered-one-of-lifes-most-essential-ingredients-to-earth/"]]},
 {"id": "buzulcagi", "bolum": "dunya", "konu": "Bilim", "sure": 3, "seviye": "10+", "dosya": "iklim", "tarih": "25 Kasım 2026", "yer": {"ad": "Barnes Buz Takkesi, Baffin Adası, Kanada", "lat": 70.0, "lon": -73.5}, "baslik": "Kanada'daki buzdan ipucu: Yeni bir buzul çağı başlayıp durmuş olabilir mi?", "ozet": "Bilim insanları, Kanada'daki Barnes Buz Takkesi'nin yaklaşık 2 bin yıl önce yeniden büyümeye başladığını, 1960'lardan sonra ise erimeye geçtiğini buldu. Araştırmacılar bu değişimde insanların yol açtığı ısınmanın payı olduğunu söylüyor.", "neOldu": ["Barnes Buz Takkesi, bir zamanlar Kuzey Amerika'nın büyük bölümünü kaplayan dev buz örtüsünden geriye kalan son parça. Buz geri çekildikçe altından binlerce yıl önce donmuş bitkiler çıkıyor. Araştırmacılar bu bitkilerin yaşını ölçerek buzun ne zaman büyüyüp küçüldüğünü hesapladı.", "Sonuçlara göre buz takkesi yaklaşık 3 bin 600 yıl önce en küçük haline indi, yaklaşık 2 bin yıl önce yeniden büyümeye başladı. 1960'lardan sonra ise yazlar ısındıkça, kışın yağan kardan daha fazla buz kaybetmeye başladı. Çalışma ekim ayında Science dergisinde yayımlandı."], "neden": "Dünya'nın tarihinde buzul çağları ve daha sıcak dönemler birbirini izledi. Bu araştırma, insanların iklimi ne kadar güçlü etkileyebildiğine dair yeni bir tartışma başlattı.", "sinir": "Araştırma tek bir buz takkesine dayanıyor. Bazı bilim insanları, bu büyümenin yeni bir buzul çağının başladığını göstermeye yetmediğini söylüyor. Çalışmanın yazarı da sonucun, ısınmanın bizi bir buzul çağından kurtardığı biçiminde okunmaması gerektiğini vurguluyor.", "bizeNe": "Türkiye'nin yüksek dağlarındaki buzullar da son yıllarda küçülüyor. Ağrı Dağı'ndaki ve Cilo Dağları'ndaki buzullar, iklim değişikliğinin Türkiye'deki izlerini anlamak için inceleniyor.", "kelimeler": ["kanada", "buzulcagi", "iklim"], "soru": "Bir buzun altından binlerce yıllık bir bitki çıksa, ondan neler öğrenmek isterdin?", "kaynaklar": [["Columbia Lamont-Doherty", "https://lamont.columbia.edu/news/climate-change-stopped-next-ice-age"], ["Smithsonian Magazine", "https://www.smithsonianmag.com/smart-news/two-thousand-years-ago-a-new-ice-age-began-but-human-caused-climate-change-recently-reversed-it-according-to-a-new-study-180989746/"], ["Colorado Üniversitesi INSTAAR, 22 Ekim 2026", "https://www.colorado.edu/instaar/2026/10/22/failed-ice-age-arctic-ice-was-expanding-centuries-global-warming-stopped-it"], ["ScienceDaily", "https://www.sciencedaily.com/releases/2026/11/261123005350.htm"]]},
 {"id": "romagemisi", "bolum": "dunya", "konu": "Arkeoloji", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "25 Kasım 2026", "yer": {"ad": "Ilovik Adası, Hırvatistan", "lat": 44.46, "lon": 14.55}, "baslik": "2 bin 200 yıllık Roma gemisinin su geçirmezlik sırrı: Çam katranı ve balmumu", "ozet": "Hırvatistan açıklarında batmış 2 bin 200 yıllık bir Roma gemisinin kaplamaları incelendi. Gemicilerin tahta gövdeyi su geçirmez yapmak için çam katranını balmumuyla karıştırdığı anlaşıldı.", "neOldu": ["Ilovik-Paržine 1 adı verilen batık, Adriyatik Denizi'nde, bugünkü Hırvatistan kıyılarının açığında bulunuyor. Fransız ve Hırvat araştırmacılar, geminin gövdesinden alınan 10 kaplama örneğini laboratuvarda inceledi.", "Örneklerin hepsinde ısıtılmış çam reçinesi ya da katranı vardı. Bir örnekte ise katran balmumuyla karıştırılmıştı; eski Yunan tersanelerinde bu karışıma zopissa deniyordu. Örneklerdeki çiçek tozları da kaplamanın Akdeniz çevresindeki ormanlardan gelen malzemelerle, birkaç ayrı seferde yapıldığını gösteriyor."], "neden": "Tahta gemiler su aldıkça çürür ve batar. Bu araştırma, binlerce yıl önceki denizcilerin gemilerini uzun yolculuklara dayanıklı kılmak için ne kadar akıllıca yöntemler bulduğunu gösteriyor.", "sinir": "Balmumunun kaplamayı daha esnek ve kolay sürülebilir yaptığı düşünülüyor ama bu doğrudan ölçülmedi. Araştırma tek bir batıktan alınan az sayıda örneğe dayanıyor.", "bizeNe": "Türkiye kıyılarında da çok sayıda antik batık var. Kaş açıklarında bulunan Uluburun batığı dünyanın en ünlü batıklarından biri; buluntuları Bodrum Sualtı Arkeoloji Müzesi'nde sergileniyor.", "kelimeler": ["hirvatistan", "arkeoloji", "polen"], "soru": "Tahtadan bir salı su geçirmez yapmak zorunda kalsaydın, doğada hangi malzemeleri kullanırdın?", "kaynaklar": [["ScienceDaily, 23 Kasım 2026", "https://www.sciencedaily.com/releases/2026/11/261123232342.htm"], ["Phys.org", "https://phys.org/news/2026-04-year-roman-hid-story-rewrites.html"], ["Discover Magazine", "https://www.discovermagazine.com/2-200-year-old-ancient-roman-shipwreck-uncovers-hidden-repairs-across-the-adriatic-49015"]]},
 {"id": "satranc2026", "bolum": "dunya", "konu": "Spor", "sure": 3, "seviye": "8+", "dosya": null, "tarih": "24 Kasım 2026", "yer": {"ad": "Cologny, Cenevre, İsviçre", "lat": 46.22, "lon": 6.18}, "baslik": "Satrançta dünya şampiyonluğu maçı başlıyor: Karşı karşıya gelen iki usta da 20 yaşında", "ozet": "Dünya satranç şampiyonu Hintli Gukesh Dommaraju, unvanını Özbek Cavohir Sindarov'a karşı korumaya çalışacak. 14 oyunluk maç İsviçre'nin Cenevre kenti yakınlarında oynanıyor.", "neOldu": ["Uluslararası Satranç Federasyonu FIDE'nin düzenlediği şampiyonluk maçı, Cenevre yakınlarındaki Cologny'de bir müzede yapılıyor. Açılış töreni yapıldı ve ilk oyunun bu hafta oynanması planlanıyor. Kurayla ilk oyunda beyaz taşlar Sindarov'a çıktı.", "Maçta 14 oyun var. Kazanılan her oyun 1 puan, berabere biten oyun ise yarım puan getiriyor. 14 oyunun sonunda puanlar eşit olursa daha kısa süreli oyunlarla kazanan belirlenecek. Maçın aralık ortasına kadar sürmesi bekleniyor.", "İki oyuncu da 20 yaşında. Bu yüzden bu maç, satranç tarihinin en genç oyuncularla oynanan dünya şampiyonluğu maçı olarak anılıyor. Gukesh, unvanını 2024'te Singapur'da kazanmıştı. Sindarov ise bu maça çıkma hakkını Nisan 2026'daki Adaylar Turnuvası'nı kazanarak elde etti."], "neden": "Sindarov, Özbekistan'dan dünya şampiyonluğu maçına çıkan ilk satranççı. Gukesh içinse bu, unvanını ilk kez savunacağı maç. Satranç dünyasında yeni bir kuşağın en üst seviyeye yükseldiğini gösteriyor.", "bizeNe": "Özbekistan, Türkçeyle akraba bir dil olan Özbekçenin konuşulduğu bir ülke ve Türkiye ile yakın bağları var. Satranç Türkiye'de de okullarda ve kulüplerde çok sevilen bir oyun; maçın hamlelerini internetten canlı izlemek mümkün.", "kelimeler": ["satranc", "fide", "hindistan", "ozbekistan", "isvicre"], "soru": "Bir satranç oyunu saatlerce sürebiliyor. Sence bu kadar uzun süre dikkatini toplamak için neler yapmak gerekir?", "kaynaklar": [["FIDE: Gukesh ve Sindarov karşı karşıya", "https://www.fide.com/?p=51815"], ["Chess.com: Açılış töreni", "https://www.chess.com/news/view/2026-fide-chess-world-championship-opening-ceremony"], ["ChessBase India: Maç rehberi", "https://chessbase.in/news/fide-world-championship-match-2026-preview-report"], ["Al Jazeera, 15 Nisan 2026: Sindarov Adaylar Turnuvası'nı kazandı", "https://www.aljazeera.com/amp/sports/2026/4/15/uzbek-chess-grandmaster-sindarov-sets-up-world-title-match-with-gukesh"]]},
 {"id": "uzayrobotu", "bolum": "dunya", "konu": "Teknoloji", "sure": 3, "seviye": "10+", "dosya": "uzay", "tarih": "24 Kasım 2026", "baslik": "Uzayda bir ilk: Robot, astronot yardımı olmadan yapı kurdu", "ozet": "ABD'deki Caltech üniversitesinin geliştirdiği ASTRA adlı robot, Dünya'nın etrafında dönerken parçaları birleştirerek bir anten iskeletinin bir bölümünü kendi başına kurdu.", "neOldu": ["ASTRA, 30 Mart 2026'da bir SpaceX roketiyle uzaya gönderildi. Görevi, çubuk biçimindeki parçaları özel bağlantılarla birbirine takarak yaklaşık 1,4 metre genişliğinde bir anten iskeleti kurmaktı. Robot bu sırada iskeletin üzerine ince, yansıtıcı bir ağ da yerleştirdi.", "Çalışmalar sırasında beklenmedik sorunlar çıktı. Mühendisler, laboratuvarda duran ASTRA'nın bir ikizi üzerinde çözümleri denedi, sonra yeni komutları uzaydaki robota gönderdi. Projeyi destekleyen ABD kurumu DARPA, 5 Kasım'da robotun iskeletin bir bölümünü başarıyla kurduğunu duyurdu."], "neden": "Büyük antenleri ve teleskopları roketlere sığdırmak çok zor. Parçaları uzaya küçük paketler halinde gönderip orada robotlara kurdurmak, gelecekte çok daha büyük yapıların yapılmasını sağlayabilir.", "sinir": "Robot, planlanan antenin tamamını değil yalnızca bir bölümünü kurabildi. Ayrıca bu, oldukça basit bir iskelet; çok daha büyük ve karmaşık yapıların aynı yöntemle kurulup kurulamayacağı henüz bilinmiyor.", "bizeNe": "Türkiye de kendi uydularını geliştiren ve uzay çalışmalarını büyüten ülkelerden biri. Uzayda yapı kurmayı sağlayan teknolojiler, gelecekte bütün ülkelerin uydularını ve iletişim sistemlerini etkileyebilir.", "kelimeler": ["abd", "yorunge"], "soru": "Uzayda bir robota bir şey inşa ettirebilseydin ne yaptırırdın?", "kaynaklar": [["DARPA, 5 Kasım 2026", "https://www.darpa.mil/news/2026/nom4d-program-demonstrates-automated-in-space-assembly"], ["Space.com", "https://space.com/technology/a-robot-just-built-a-structure-autonomously-in-space-for-the-1st-time-ever"], ["Caltech / ScienceDaily", "https://sciencedaily.com/releases/2026/11/261108233043.htm"]]},
 {"id": "escapade", "bolum": "dunya", "konu": "Uzay", "sure": 2, "seviye": "8+", "dosya": "uzay", "tarih": "24 Kasım 2026", "baslik": "İkiz uzay araçları Dünya'dan hız alıp Mars yoluna çıktı", "ozet": "NASA'nın ESCAPADE adlı ikiz uzay araçları, Kasım başında Dünya'nın yakınından geçerek Mars'a doğru fırlatıldı. Araçların Mars'a 2027 sonbaharında varması bekleniyor.", "neOldu": ["İki küçük uzay aracı, 13 Kasım 2025'te fırlatıldı. O sırada Dünya ile Mars, Güneş'in iki ayrı tarafındaydı; bu yüzden araçlar bir yıl boyunca Dünya'dan yaklaşık 1,5 milyon kilometre uzaktaki bir noktanın çevresinde beklediler.", "Birinci araç 7 Kasım'da, ikincisi 9 Kasım'da Dünya'nın yaklaşık 1.600 kilometre yukarısından geçti. Bu sırada motorlarını da çalıştırdılar. Dünya'nın çekim gücü onları bir sapan gibi fırlatarak Mars yoluna soktu."], "neden": "ESCAPADE, Mars'ın çevresindeki ince havayı ve Güneş'ten gelen parçacıkların bu havayı nasıl etkilediğini inceleyecek. Bu bilgiler, Mars'ın zamanla havasını ve suyunu nasıl kaybettiğini anlamamıza yardım edebilir.", "bizeNe": "Mars, bazı geceler Türkiye'den de çıplak gözle kırmızımsı bir nokta gibi görülebiliyor. Ona giden her araç, gelecekte insanların oraya gidip gidemeyeceğini anlamamıza katkı sağlıyor.", "kelimeler": ["nasa", "mars", "yorunge", "gunes"], "soru": "Bir uzay aracı gezegenlerin çekim gücünü kullanarak hızlanabiliyor. Sence bu, salıncakta sallanırken hız kazanmaya benziyor mu?", "kaynaklar": [["NASA: ESCAPADE Dünya'dan hız alacak", "https://science.nasa.gov/blogs/escapade/2026/11/02/nasas-twin-escapade-spacecraft-to-slingshot-past-earth-on-way-to-mars/"], ["NASA: ESCAPADE Mars yolunda", "https://science.nasa.gov/science-research/heliophysics/nasas-escapade-completes-powered-earth-flybys-now-en-route-to-mars/"], ["New Space Economy, 10 Kasım 2026", "https://newspaceeconomy.ca/2026/11/10/escapade-powered-earth-flybys-mars-cruise-2026/?amp=1"]]},
 {"id": "balinaisimleri", "bolum": "dunya", "konu": "Doğa", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "24 Kasım 2026", "yer": {"ad": "Nova Scotia, Kanada", "lat": 44.65, "lon": -63.57}, "baslik": "Nesli tehlikedeki 20 balinaya isim verildi: Biri ünlü bir şarkıcının adını aldı", "ozet": "Bilim insanları, Kuzey Atlantik'te yaşayan ve nesli çok büyük tehlike altında olan 20 balinaya yeni isimler verdi. İsimler, Kanada'daki yıllık bir toplantıda açıklandı.", "neOldu": ["Kuzey Atlantik doğru balinalarının başlarında, deriden oluşan beyazımsı, pürüzlü lekeler bulunuyor. Bu lekelerin şekli her balinada farklı; bilim insanları balinaları tek tek bu lekelerden tanıyor. Her balinanın bir katalog numarası var, bazılarına da akılda kalması için isim veriliyor.", "Bu yılki isimler, Kanada'nın Nova Scotia bölgesinde yapılan yıllık toplantıda duyuruldu. 4191 numaralı balinaya, başındaki leke ünlü şarkıcı Dolly Parton'ın kabarık saçlarına benzediği için Dolly adı verildi. Bir başka balina ise bir kukla karakterinden esinlenerek Gonzo adını aldı."], "neden": "İsim vermek eğlenceli görünse de önemli bir işe yarıyor: Balinaları takip etmeyi kolaylaştırıyor ve insanların bu türü tanıyıp korumak istemesini sağlıyor. Balinaların kataloğunu ABD'deki New England Akvaryumu tutuyor.", "bizeNe": "Bilim insanları dünyanın birçok denizinde yunusları da sırt yüzgeçlerindeki çentiklerden tek tek tanıyabiliyor. Türkiye'nin denizlerinde yaşayan yunuslar da bu tür yöntemlerle izlenebiliyor.", "kelimeler": ["neslitehlike", "kanada", "abd"], "soru": "Bir balinaya isim verecek olsan, onu neye bakarak seçerdin?", "kaynaklar": [["NHPR, 19 Kasım 2026", "https://www.nhpr.org/2026-11-19/dolly-and-donegal-among-new-names-for-endangered-north-atlantic-right-whales"], ["Popular Science", "https://www.popsci.com/?p=795387"], ["Connecticut Public, 19 Kasım 2026", "https://www.ctpublic.org/2026-11-19/dolly-and-donegal-among-new-names-for-endangered-north-atlantic-right-whales"]]},
 {"id": "verica", "bolum": "dunya", "konu": "Tarih", "sure": 3, "seviye": "10+", "dosya": null, "tarih": "24 Kasım 2026", "yer": {"ad": "Güney İngiltere", "lat": 51.0, "lon": -1.0}, "baslik": "2 bin yıl önceki ünlü kral aslında bir kraliçe miydi?", "ozet": "İngiltere'de bir arkeolog, Romalıların Britanya'ya gelmesinde rol oynayan Verica adlı hükümdarın erkek değil kadın olduğunu öne sürdü. Bu görüş tarihçiler arasında tartışılıyor.", "neOldu": ["Verica, yaklaşık 2 bin yıl önce bugünkü güney İngiltere'de yaşayan Atrebat adlı bir kabilenin hükümdarıydı. Milattan sonra 40 yılı civarında tahttan indirildi ve Roma İmparatoru Claudius'tan yardım istemek için Roma'ya gitti. Romalılar üç yıl sonra, milattan sonra 43'te Britanya'ya girdi.", "Bournemouth Üniversitesi'nden arkeolog Miles Russell, Verica'nın bir kadın olduğunu düşünüyor. Russell'a göre adın \"-a\" ile bitmesi, o dönemin kadın hükümdarlarının adlarına benziyor. Verica'nın paralarında Latince \"kral\" anlamına gelen \"rex\" sözcüğü yazıyor; Russell bu sözcüğün o dönemde kadın hükümdarlar için de kullanılabileceğini savunuyor. Paralarda at üstünde, elinde mızrak tutan ince bir figür de var."], "neden": "Tarih, eski yazılar, paralar ve buluntular yorumlanarak yazılıyor. Aynı kanıtlara farklı açılardan bakmak, yüzyıllardır doğru sanılan bir bilginin yeniden sorgulanmasını sağlayabiliyor.", "sinir": "Bu bir yorum, kesin bir kanıt değil. Verica'nın kadın olduğunu doğrudan gösteren bir yazı ya da buluntu yok. Bazı tarihçiler bu görüşe katılmıyor.", "bizeNe": "Anadolu'da da eski paralar, hükümdarlar hakkında bilgi veren önemli kaynaklar. Müzelerimizde sergilenen antik sikkeler, o dönemin insanlarının kendilerini nasıl göstermek istediklerini anlatıyor.", "kelimeler": ["birlesikkrallik", "romaimparatorlugu", "arkeoloji"], "soru": "Eski bir paranın üzerindeki resme bakarak o dönem hakkında neler öğrenebiliriz?", "kaynaklar": [["Archaeology Magazine", "https://archaeology.org/?p=62399"], ["Gizmodo", "https://gizmodo.com/the-iron-age-king-who-lured-rome-into-britain-was-actually-a-woman-archaeologists-say-2000834978"], ["IFLScience", "https://www.iflscience.com/iron-age-barbarian-king-who-triggered-roman-invasion-of-britain-was-actually-a-woman-historian-argues-85117"]]},
 {"id": "kuasarcifti", "bolum": "dunya", "konu": "Uzay", "sure": 3, "seviye": "10+", "dosya": "uzay", "tarih": "24 Kasım 2026", "baslik": "Evrenin bebeklik çağından iki dev kara delik: Bilinen en uzak kuasar çifti bulundu", "ozet": "Gökbilimciler, evren yalnızca yaklaşık 900 milyon yaşındayken parlayan, birbirine çok yakın iki kuasar buldu. Bu, şimdiye kadar bulunan en uzak ve en eski yakın kuasar çifti olabilir.", "neOldu": ["Kuasarlar, merkezlerinde dev bir kara delik bulunan ve çok parlak ışık saçan galaksi merkezleri. Uluslararası bir ekip, Hawaii'deki Gemini Kuzey teleskobuyla ve James Webb Uzay Teleskobu ile bu çifti inceledi.", "İki kuasar arasında yaklaşık 18 bin 100 ışık yılı mesafe var; bu, Samanyolu'nun genişliğinin yaklaşık beşte biri. Kara deliklerden biri Güneş'in 1,5 milyar katı, diğeri 400 milyon katı ağırlığında. Evrenin ilk dönemlerinden bilinen yalnızca üçüncü kuasar çifti bu."], "neden": "Bu kadar büyük kara deliklerin evren bu kadar gençken oluşmuş olması şaşırtıcı. Bu keşif, kara deliklerin nasıl bu kadar hızlı büyüdüğü sorusunu yeniden gündeme getiriyor.", "sinir": "İkinci kuasarın gerçekten ayrı bir kuasar olduğu henüz kesinleşmedi. Önde duran bir gök cisminin ışığı bükerek tek bir kuasarı iki tane gibi göstermesi ihtimali tamamen dışlanmış değil; bilim insanları bunu ek gözlemlerle araştırıyor.", "bizeNe": "Gökyüzünde gördüğümüz ışık bize çok uzun yolculuklardan sonra ulaşıyor. Bu kuasarların ışığı, Dünya henüz oluşmadan çok önce yola çıktı.", "kelimeler": ["kuasar", "karadelik", "galaksi", "teleskop", "isikyili", "samanyolu"], "soru": "Gökyüzüne baktığımızda aslında geçmişi görüyoruz. Bu fikir sana nasıl geliyor?", "kaynaklar": [["Space.com", "https://www.space.com/astronomy/black-holes/astronomers-stunned-after-james-webb-space-telescope-discovers-the-earliest-pair-of-black-hole-powered-quasars"], ["Sci.News, 11 Kasım 2026", "https://sci.news/astronomy/record-breaking-quasar-pair-early-universe-15191.html"], ["EurekAlert", "https://www.eurekalert.org/news-releases/1151327"]]},
 {"id": "yabankecisi", "bolum": "turkiye", "konu": "Doğa", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "24 Kasım 2026", "yer": {"ad": "Erzurum", "lat": 39.9, "lon": 41.27}, "baslik": "Erzurum'un dağlarında yaban keçileri çoğalıyor: Sayıları 3 bini aştı", "ozet": "Doğa Koruma ve Milli Parklar ekiplerinin izleme çalışmalarına göre Erzurum'da yaklaşık 2 bin 700 yaban keçisi ve 300'ün üzerinde çengel boynuzlu dağ keçisi yaşıyor.", "neOldu": ["Sonuçlar 17 Kasım'da paylaşıldı. 2024'te yapılan sayımda Erzurum'da yaklaşık 2 bin 300 yaban keçisi ve 250 civarında çengel boynuzlu dağ keçisi tespit edilmişti. Yani iki yılda iki türün de sayısı arttı.", "Ekipler kış aylarında hayvanlar aç kalmasın diye doğaya 3 bin 610 kilogram yem bıraktı. Kaçak avcılıkla mücadele de artışın nedenlerinden biri olarak gösteriliyor. Haziran ayında açıklanan başka bir sayımda ise rakamlar biraz farklıydı; iki çalışmada kullanılan yöntemler aynı olmayabilir."], "neden": "Yaban keçileri sarp kayalıklarda yaşayan, boynuzları çok uzun olabilen hayvanlar. Sayılarının artması, yaşadıkları dağların korunduğunun ve koruma çalışmalarının işe yaradığının bir işareti.", "kelimeler": ["erzurum", "yabankecisi", "dkmp"], "soru": "Vahşi hayvanları saymak çok zor. Sence bilim insanları dağlarda yaşayan keçileri nasıl sayıyor olabilir?", "kaynaklar": [["AA, 18 Kasım 2026", "https://www.aa.com.tr/tr/gundem/erzurumda-yaban-ve-cengel-boynuzlu-dag-kecisi-sayisi-3-bini-asti/4128414"], ["Haberkenti", "https://www.haberkenti.com/erzurum-dag-kecisi-envanteri-iki-turun-sayisi-3-bini-asti"]]},
 {"id": "butce2027", "bolum": "turkiye", "konu": "Siyaset", "sure": 3, "seviye": "10+", "dosya": "meclis", "tarih": "24 Kasım 2026", "yer": {"ad": "TBMM, Ankara", "lat": 39.91, "lon": 32.85}, "baslik": "Devletin 2027 bütçesi Meclis'te: Komisyondaki görüşmeler bu hafta bitiyor", "ozet": "Devletin gelecek yıl ne kadar para toplayıp nereye harcayacağını gösteren 2027 bütçesi, Meclis'in Plan ve Bütçe Komisyonu'nda görüşülüyor. Komisyon aşamasının 27 Kasım Cuma günü tamamlanması planlanıyor.", "neOldu": ["Bütçe teklifi 16 Ekim'de Meclis'e sunuldu. Plan ve Bütçe Komisyonu'ndaki görüşmeler 21 Ekim'de başladı. O günden beri her bakanlık ve kamu kurumu kendi bütçesini komisyonda anlatıyor, milletvekilleri de sorular soruyor.", "Komisyondaki çalışma bittikten sonra bütçe, bütün milletvekillerinin katıldığı Genel Kurul'a gelecek. Burada maddeler tek tek oylanacak. Bütçenin yıl sonuna kadar kabul edilmesi ve 1 Ocak 2027'de uygulanmaya başlaması öngörülüyor."], "neden": "Bütçe, okulların, hastanelerin, yolların ve daha birçok hizmetin parasının nereden geleceğini belirliyor. Devletin hangi işe ne kadar para ayıracağına halkın seçtiği milletvekilleri karar veriyor.", "taraflar": "Muhalefet milletvekilleri, bütçeden borç faizine ayrılan payın arttığını, öğrenci yurtları ve bursların yetersiz kaldığını söylüyor; harcamaların Meclis'te daha sıkı denetlenmesini istiyor. Hükümet ve iktidar partisi milletvekilleri ise bütçenin yatırımlarla hizmetleri güçlendirdiğini, örneğin sağlık yatırımlarının hizmet kalitesini artırdığını söylüyor; eleştirilere komisyonda yanıt veriyor.", "kelimeler": ["butce", "pbk", "meclis", "milletvekili"], "soru": "Okulunun bir yıllık bütçesini sen hazırlasaydın, paranın en büyük kısmını neye ayırırdın? Neden?", "kaynaklar": [["AA (Foreks üzerinden), 17 Ekim 2026: Bütçe takvimi", "https://www.foreks.com/haber/detay/6ad31590422c786f3f7a4ce1/AA/tr/meclisin-2027-yili-butce-gorusme-takvimi-belirlendi-17-10-26/"], ["Bloomberg HT: Bütçe takvimi", "https://www.bloomberght.com/meclisin-2027-yili-butce-gorusme-takvimi-belirlendi-3791721"], ["Habererk: Muhalefetin eleştirileri", "https://www.habererk.com/haber/muhalefet-2027-butcesinde-fon-krizi-ve-faiz-giderlerini-elestirdi_358208/"], ["Haberton: Muhalefet eleştirdi, hükümet yanıtladı", "https://haberton.com/2027-butcesi-tbmm-plan-ve-butce-komisyonunda-muhalefet-guven-birakmadiniz-dedi-hukumet-yanitladi/"]]},
 {"id": "ogretmengunu24", "bolum": "turkiye", "konu": "Okul", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "24 Kasım 2026", "baslik": "Bugün Öğretmenler Günü: Okullar açık, törenler okul saatinde", "ozet": "24 Kasım Öğretmenler Günü resmi tatil değil; dersler normal programla yapılıyor. Okullarda ve il müdürlüklerinde \"Hep Sen Varsın Diye...\" temasıyla kutlamalar düzenleniyor.", "neOldu": ["Milli Eğitim Bakanlığı'nın takvimine göre bugün okullar açık. Bazı okullar törenler yüzünden ders saatlerinde küçük değişiklikler yapabiliyor.", "Bakanlığın genelgesine göre adaylık sürecini tamamlayan genç öğretmenler bugün yemin edecek. Kutlamalara katılan emekli öğretmenlere Hizmet Şeref Belgesi verilecek. İllerde ağaç dikme etkinlikleri de yapılacak."], "neden": "Türkiye'de Öğretmenler Günü 1981'den beri kutlanıyor. Bu gün, Atatürk'ün 24 Kasım 1928'de Millet Mektepleri'nin Başöğretmenliğini kabul ettiği günün yıl dönümü.", "kelimeler": ["meb", "ataturk"], "soru": "Öğretmenine bugün tek bir cümleyle teşekkür etseydin ne derdin?", "kaynaklar": [["MEB: 24 Kasım genelgesi", "https://mevzuat.meb.gov.tr/dosyalar/2323.pdf"], ["Habertürk: Bugün okullar tatil mi?", "https://www.haberturk.com/bilgi/foto/bugun-okullar-tatil-mi-24-kasim-ogretmenler-gunu-nde-okul-var-mi-yarim-gun-mu-3929592"], ["Yeni Şafak", "https://www.yenisafak.com/galeri/ozgun/ogretmenler-gununde-okullar-tatil-mi-24-kasim-2026-ogretmenler-gununde-okullar-tatil-mi-ders-var-mi-4875485"], ["Karar", "https://www.karar.com/guncel-haberler/ogretmenler-gununde-okullar-yarim-gun-mu-ders-islenecek-mi-24-kasim-2085826"]]},
 {"id": "gsastonvilla", "bolum": "turkiye", "konu": "Spor", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "24 Kasım 2026", "yer": {"ad": "RAMS Park, İstanbul", "lat": 41.1, "lon": 28.99}, "baslik": "Şampiyonlar Ligi'nde 5. maç: Galatasaray bu akşam Aston Villa'yı ağırlıyor", "ozet": "Galatasaray, UEFA Şampiyonlar Ligi'nin lig aşamasındaki beşinci maçında İngiliz takımı Aston Villa ile karşılaşıyor. Maç saat 20.45'te İstanbul'daki RAMS Park'ta başlayacak.", "neOldu": ["İki takım resmi bir maçta ilk kez karşı karşıya gelecek. Aston Villa, İngiltere'nin Birmingham kentinin köklü kulüplerinden biri.", "Şampiyonlar Ligi'nde artık gruplar yok; bütün takımlar tek bir büyük lig tablosunda yarışıyor ve her takım bu aşamada sekiz maç oynuyor. Galatasaray'ın lig aşamasında üç maçı daha olacak: Aralık'ta AEK, ocakta Feyenoord ve Paris Saint-Germain ile karşılaşacak."], "neden": "Şampiyonlar Ligi, Avrupa'nın en güçlü kulüplerinin yarıştığı turnuva. Buradan alınan puanlar hem takımın turnuvada ilerlemesini hem de Türkiye'nin Avrupa kupalarındaki sıralamasını etkiliyor.", "kelimeler": ["uefa", "birlesikkrallik", "istanbul"], "soru": "Kendi sahasında oynayan bir takım için seyircilerin desteği sence ne kadar önemli?", "kaynaklar": [["UEFA: Maç bilgisi", "https://www.uefa.com/uefachampionsleague/match/2049631--galatasaray-vs-aston-villa/matchinfo/"], ["Sports Mole: Maç önü", "https://www.sportsmole.co.uk/football/champions-league/galatasaray-vs-aston-villa_game_263351.html"], ["Sporx", "https://www.sporx.com/galatasaray-aston-villa-maci-canli-6106339"], ["Küre Ansiklopedi: Galatasaray'ın 2026-27 fikstürü", "https://kureansiklopedi.com/detay/galatasaray-2026-27-uefa-sampiyonlar-ligi-karsil-3"]]},
 {"id": "paratekvando", "bolum": "turkiye", "konu": "Spor", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "23 Kasım 2026", "yer": {"ad": "Muju, Güney Kore", "lat": 36.01, "lon": 127.66}, "baslik": "Para tekvandoda 10 madalya: Milli takım dünya ikincisi oldu", "ozet": "Güney Kore'de yapılan Dünya Para Tekvando Şampiyonası'nda milli sporcular 4 altın, 1 gümüş ve 5 bronz madalya kazandı. Türkiye takım sıralamasında ikinci oldu.", "neOldu": ["Şampiyona 21-22 Kasım'da Güney Kore'nin Muju kentinde yapıldı. 60'tan fazla ülkeden sporcunun yarıştığı organizasyonda milli takım toplam 10 madalya topladı ve ülkeler sıralamasını ikinci sırada bitirdi.", "Altın madalya kazananlar arasında 63 kiloda Mahmut Bozteke ve 80 kiloda Emre Bulgur var. Emre Bulgur finalde Meksikalı rakibini 2-1 yendi. Denizlili Fatih Gültekin de kendi sınıfında bronz madalyanın sahibi oldu."], "neden": "Bu şampiyonada kazanılan puanlar, 2028'de Los Angeles'ta yapılacak Paralimpik Oyunları'na katılım sıralamasını da etkiliyor. Para sporcular, engellerinin türüne göre ayrılan sınıflarda yarışıyor; böylece benzer durumdaki sporcular birbiriyle karşılaşıyor.", "kelimeler": ["tekvando", "paraspor", "guneykore", "paralimpik"], "soru": "Bir sporda iyi olmak için yetenek mi daha önemli, çalışmak mı? Sen hangi sporu denemek isterdin?", "kaynaklar": [["Sporx", "https://www.sporx.com/dunya-para-tekvando-sampiyonasi-nda-turkiye-den-10-madalya-SXHBQ1183649SXQ"], ["BHA", "https://www.bha.net.tr/spor/para-tekvandocular-dunya-sampiyonasini-10-madalyayla-tamamladi/469961"], ["Aydınlık", "https://www.aydinlik.com.tr/haber/turkiye-para-tekvandoda-dunya-ikincisi-oldu-600129"], ["BirGün: Emre Bulgur dünya şampiyonu", "https://www.birgun.net/haber/tekvandoda-emre-bulgur-dunya-sampiyonu-oldu-747783"]]},
 {"id": "sinavyok", "bolum": "turkiye", "konu": "Okul", "sure": 3, "seviye": "8+", "dosya": null, "tarih": "23 Kasım 2026", "baslik": "Yeni kural: İlkokulda sınav yok, okullar ve öğrenciler sıralanmayacak", "ozet": "Milli Eğitim Bakanlığı'nın sınav kurallarında değişiklik yapıldı. Artık anaokulunda ve ilkokulda hangi adla olursa olsun sınav yapılamayacak.", "neOldu": ["Değişiklik, 14 Kasım'da Resmi Gazete'de yayımlanarak yürürlüğe girdi. Yönetmeliğe göre okul öncesi ve ilkokulda yazılı ya da test gibi sınavlar yapılmayacak. Bunun yerine öğretmenler, öğrencilerin yıl boyunca nasıl geliştiğini izleyerek değerlendirme yapacak.", "Yeni kurallar tüm kademeler için bir şeyi daha değiştiriyor: Sınav sonuçları, öğrencileri, sınıfları, okulları ya da illeri birbiriyle sıralamak ve karşılaştırmak için kullanılamayacak. Ölçme ve değerlendirme çalışmaları bundan sonra kısmen ya da tamamen dijital ortamda da yapılabilecek.", "Ortaokul ve liselerde ise yazılı sınavlarda yeni bir dönem başlıyor. Ortak Yazılı Sınav Sistemi bu eğitim yılının ilk döneminin ilk yazılılarından itibaren uygulanıyor."], "neden": "Bu kurallar, Türkiye'deki milyonlarca öğrencinin okul hayatını doğrudan etkiliyor. Sınav yerine gelişimi izlemek, her öğrencinin kendi hızında ilerlemesine odaklanmayı amaçlıyor.", "kelimeler": ["meb", "yonetmelik", "resmigazete"], "soru": "Bir konuyu öğrendiğini göstermenin sınav dışında hangi yolları olabilir? Sen hangisini tercih ederdin?", "kaynaklar": [["AA (Foreks üzerinden), 14 Kasım 2026", "https://www.foreks.com/haber/detay/6af8140c4b18523914462990/AA/tr/meb-olcme-ve-degerlendirme-yonetmeligi-nde-degisiklik-resmi-gazete-de-yayimlandi-14-11-26/"], ["Sabah", "https://www.sabah.com.tr/yasam/resmi-gazetede-yayimlandi-meb-olcme-ve-degerlendirme-yonetmeliginde-degisiklik-7701539"], ["Yeniçağ", "https://www.yenicaggazetesi.com/meb-yeni-yonetmeligi-resmi-gazetede-yayimlandi-ilkokullarda-sinav-sistemi-kaldirildi-1090938h.htm"], ["Milli Gazete", "https://www.milligazete.com.tr/mebden-milyonlarca-ogrenciyi-ilgilendiren-karar-ilkokullarda-sinav-yapilmayacak"]]},
 {"id": "yilinkelimesi", "bolum": "dunya", "konu": "Kültür", "sure": 2, "seviye": "8+", "dosya": "yapayzeka", "tarih": "23 Kasım 2026", "yer": {"ad": "Cambridge, Birleşik Krallık", "lat": 52.2, "lon": 0.12}, "baslik": "2026'nın kelimesi belli oldu: \"İnsan\"", "ozet": "Dünyanın en çok kullanılan İngilizce sözlüklerinden Cambridge Sözlüğü, 2026 yılının kelimesi olarak \"human\" yani \"insan\" kelimesini seçti.", "neOldu": ["Sözlük her yıl, o yıl insanların en çok konuştuğu konuları yansıtan bir kelime seçiyor. Bu yılki seçim geçen hafta açıklandı. Sözlüğü hazırlayanlara göre 2026, yapay zekânın yaygınlaşmasıyla insan olmanın ne anlama geldiğinin çok tartışıldığı bir yıl oldu.", "Sözlük ekibi, \"insan yapımı\" ya da \"insan tarafından yazılmış\" gibi ifadelerin çok daha sık kullanıldığını fark etti. İnsanlar bu sözlerle, bir yazının ya da resmin bir makine tarafından değil, bir insan tarafından yapıldığını belirtmek istiyor. Son elemeye kalan öteki kelimeler arasında \"agent\" yani yapay zekâ ajanı da vardı."], "neden": "Yılın kelimesi, bir yılda dünyada nelerin konuşulduğunu kısaca özetliyor. Cambridge Sözlüğü 2023'te de yapay zekâyla ilgili bir kelime seçmişti; bu da konunun birkaç yıldır gündemde olduğunu gösteriyor.", "bizeNe": "Yapay zekâ araçları Türkiye'de de okullarda ve evlerde giderek daha çok kullanılıyor. Bir içeriği kimin hazırladığını sormak, internette doğru bilgiye ulaşmanın önemli bir parçası.", "kelimeler": ["cambridge", "yapayzeka", "birlesikkrallik"], "soru": "Sen 2026 yılı için bir Türkçe kelime seçecek olsan hangisini seçerdin? Neden?", "kaynaklar": [["CNN, 17 Kasım 2026", "https://www.cnn.com/2026/11/17/world/human-cambridge-word-of-year-scli-intl"], ["ITV News, 18 Kasım 2026", "https://www.itv.com/news/2026-11-18/cambridge-dictionary-names-human-as-2026-word-of-the-year"], ["Cambridge English", "https://www.cambridgeenglish.org/news/view/human-is-the-cambridge-dictionary-word-of-the-year-2026/"]]},
 {"id": "barajlar", "bolum": "turkiye", "konu": "Çevre", "sure": 2, "seviye": "8+", "dosya": "iklim", "tarih": "23 Kasım 2026", "yer": {"ad": "İstanbul", "lat": 41.01, "lon": 28.98}, "baslik": "İstanbul'un barajları geçen yılın yaklaşık üç katı dolu", "ozet": "Kasım yağmurlarıyla İstanbul'un barajlarındaki su yüzde 61'in üzerine çıktı. Geçen yıl aynı günlerde bu oran yüzde 20 civarındaydı.", "neOldu": ["İstanbul'un suyunu yöneten İSKİ'nin verilerine göre barajların ortalama doluluğu 4 Kasım'da yüzde 54,75'ti. Yağışlarla birlikte bu oran 17 Kasım'da yüzde 61,06'ya yükseldi.", "Barajlar arasında büyük farklar var. 18 Kasım verilerine göre Darlık Barajı yüzde 90'ın, Ömerli Barajı ise yüzde 80'in üzerindeydi. Şehrin büyük barajlarından Terkos'ta ise oran yüzde 54 civarındaydı. Geçen yıl kasım ayının bu günlerinde İstanbul'un barajları yalnızca yüzde 20 civarında doluydu."], "neden": "İstanbul'da 15 milyondan fazla insan yaşıyor ve içtiği suyun büyük kısmı bu barajlardan geliyor. Barajların dolu olması iyi bir haber, ama suyu tasarruflu kullanmak her mevsim önemli; çünkü kurak geçen bir yıl tabloyu hızla değiştirebiliyor.", "kelimeler": ["istanbul", "baraj", "iski", "kuraklik"], "soru": "Evde su tasarrufu yapmak için hemen bugün başlayabileceğin üç şey söyleyebilir misin?", "kaynaklar": [["Yeni Asır, 17 Kasım 2026", "https://www.yeniasir.com.tr/yasam/2026/11/17/iski-istanbul-barajlari-17-kasim-istanbulun-en-dolu-baraji-belli-oldu-istanbul-barajlarinda-son-durum"], ["Yeni Asır, 18 Kasım 2026", "https://www.yeniasir.com.tr/yasam/2026/11/18/istanbul-barajlarinda-yeni-tablo-ortaya-cikti-istanbul-baraj-doluluk-oranlari-yuzde-kac-omerli-terkos-alibey-buyukcekmece"], ["Politikam, 16 Kasım 2026", "https://www.politikam.com/istanbul-barajlarinda-doluluk-yuzde-61i-asti-iski-16-kasim-2026-verilerini-acikladi"], ["TGRT Haber: 22 Kasım 2025 verisi", "https://www.tgrthaber.com/aktuel/istanbul-baraj-doluluk-oranlari-aciklandi-22-kasimda-elmali-buyukcekmece-darlik-baraj-3265413"]]},
 {"id": "filler", "bolum": "dunya", "konu": "Doğa", "sure": 3, "seviye": "10+", "dosya": null, "tarih": "23 Kasım 2026", "yer": {"ad": "Udawalawe Milli Parkı, Sri Lanka", "lat": 6.47, "lon": 80.89}, "baslik": "Asya fillerinin arkadaşlık bağları zayıflıyor", "ozet": "Sri Lanka'da 12 yıl boyunca izlenen dişi filler, sayıları azaldıkça daha küçük ve birbirinden kopuk gruplar halinde yaşamaya başladı.", "neOldu": ["ABD'deki California Üniversitesi San Diego'dan araştırmacılar, Sri Lanka'daki Udawalawe Milli Parkı'nda 440'tan fazla dişi Asya filini 12 yıl boyunca takip etti. Filler çok sosyal hayvanlar; dişiler akrabaları ve arkadaşlarıyla gruplar halinde dolaşıyor.", "Araştırmanın başında izlenen dişilerin yaklaşık yüzde 69'u 2018'e kadar çalışma alanından kayboldu. Geride kalan filler daha küçük ve birbirinden daha uzak gruplar oluşturdu. Araştırmacılar, özellikle zayıf arkadaşlık bağlarının koptuğunu gördü. Sonuçlar 12 Kasım'da Science dergisinde yayımlandı."], "neden": "Filler, yiyecek ve su bulmak ya da tehlikeden korunmak için grup içindeki bilgilere güveniyor. Bağlar koptuğunda bu bilgi paylaşımı da zayıflayabilir. Araştırmacılar, bu kopukluğun kolay onarılamayabileceği uyarısında bulunuyor.", "sinir": "Araştırma tek bir milli parktaki fillerle yapıldı; başka bölgelerdeki filler için aynı sonucun geçerli olup olmadığı bilinmiyor. Kopan bağların zamanla yeniden kurulup kurulamayacağı da henüz belli değil.", "bizeNe": "Türkiye'de de bozkurt ve yaban keçisi gibi sürüler halinde yaşayan hayvanlar var. Yaşam alanları bölündüğünde bu hayvanların sürüleri de küçülüp birbirinden kopabiliyor.", "kelimeler": ["srilanka", "asyafili"], "soru": "Arkadaşlarınla aranda zayıflayan bir bağı yeniden güçlendirmek isteseydin ne yapardın?", "kaynaklar": [["EurekAlert (UC San Diego)", "https://www.eurekalert.org/news-releases/1150948"], ["EurekAlert (AAAS)", "https://www.eurekalert.org/news-releases/1150958"], ["ConnectSci", "https://connectsci.au/news/news-parent/10411/Declining-Asian-elephant-population-leads-to"]]},
 {"id": "mebi", "bolum": "turkiye", "konu": "Teknoloji", "sure": 2, "seviye": "10+", "dosya": "yapayzeka", "tarih": "23 Kasım 2026", "baslik": "MEB'in öğrenme platformu MEBİ yenilendi: İnternetsiz de çalışıyor", "ozet": "Milli Eğitim Bakanlığı, öğrencilerin ders çalışmak için kullandığı MEBİ platformunu yeniledi. Platformdaki yapay zekâ asistanı KANKA artık haftalık çalışma planı hazırlayabiliyor.", "neOldu": ["Bakanlık, MEBİ'nin web sitesini ve telefon uygulamasını 20 Kasım'da yenileyerek kullanıma sundu. Öğrenciler hangi dersleri çalışmak istediklerini, hangi saatlerde müsait olduklarını ve hangi konularda zorlandıklarını KANKA'ya yazarak kendilerine özel bir haftalık plan oluşturabiliyor.", "İçerikler artık telefona önceden indirilip internet olmadan da kullanılabiliyor. Ayrıca öğrencilerin ders notlarını tek bir yerde toplayabileceği bir not defteri bölümü eklendi. Az gören ve görmeyen öğrenciler için ekran okuyucu ve klavyeyle kullanım da güçlendirildi."], "neden": "MEBİ önce lise, sonra ortaokul öğrencilerinin kullanımına açılmıştı. İnternetsiz çalışma özelliği, bağlantının zayıf olduğu yerlerde yaşayan öğrencilerin de platformdan yararlanmasını kolaylaştırabilir.", "kelimeler": ["meb", "mebi", "yapayzeka"], "soru": "Bir yapay zekâ asistanı sana çalışma planı hazırlasa, ona hangi bilgileri verirdin? Hangi kararları kendin vermek isterdin?", "kaynaklar": [["Yeni Şafak", "https://www.yenisafak.com/gundem/mebi-bireysel-ogrenme-platformu-yenilendi-4874834"], ["Radikal", "https://www.radikal.com.tr/gundem/mebi-yenilendi-ogrencilere-yapay-zeka-destekli-yeni-ozellikler-geldi-40374/"], ["İstiklal", "https://www.istiklal.com.tr/egitim/meb-dugmeye-basti-ogretmen-ogrenci-ve-veliler-icin-yeni-uygulama-1110941h"]]},
 {"id": "koklayankopek", "bolum": "dunya", "konu": "Bilim", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "23 Kasım 2026", "yer": {"ad": "Leipzig, Almanya", "lat": 51.34, "lon": 12.37}, "baslik": "Burnu kuvvetli yardımcılar: Köpekler istilacı bitkileri kokusundan buluyor", "ozet": "Almanya'da gönüllüler ve köpekleri, doğaya zarar veren istilacı bitkileri koklayarak bulmak için eğitildi. Arazideki son testte ekipler hedef bitkileri ortalama yüzde 75 başarıyla buldu.", "neOldu": ["Helmholtz Çevre Araştırmaları Merkezi'nden (UFZ) bilim insanları, 2021-2023 yılları arasında 31 köpeği ve sahiplerini eğitti. Köpekler üç istilacı bitkinin kokusunu tanımayı öğrendi: Himalaya balsamı, ambrosia ve Japon çobandeğneği gibi çobandeğneği ailesinden bitkiler.", "Eğitimin sonunda ekipler gerçek doğada test edildi ve aradıkları bitkileri ortalama yüzde 75 başarıyla buldu. Araştırmacılara göre köpekler, kendilerine öğretilmeyen bitkileri yanlışlıkla göstermedi. Çalışma PLOS One dergisinde yayımlandı."], "neden": "İstilacı bitkiler başka yerlerden gelip hızla yayılan ve yerli bitkilerin yerini alan türler. Ne kadar erken fark edilirlerse onlarla baş etmek o kadar kolay oluyor. Köpeklerin keskin burnu bu işte büyük bir yardımcı olabilir.", "sinir": "Bu bir ön çalışma ve az sayıda köpekle yapıldı. Yüzde 75 bir ortalama; yani ekipler bazı bitkileri gözden kaçırdı. Yöntemin farklı bitkilerde ve bölgelerde ne kadar işe yarayacağı henüz bilinmiyor.", "bizeNe": "Türkiye'de de köpekler, kayıp insanları arama ve kurtarma çalışmalarında görev alıyor. Bu araştırma, köpeklerin doğayı korumada da yeni görevler üstlenebileceğini gösteriyor.", "kelimeler": ["almanya", "istilaci"], "soru": "Köpeğinin süper güçlü burnu olsaydı, ona neyi bulmayı öğretirdin?", "kaynaklar": [["EurekAlert", "https://www.eurekalert.org/news-releases/1149595"], ["Good News Network", "https://www.goodnewsnetwork.org/dogs-can-sniff-out-invasive-plant-species-with-75pt-accuracy/"], ["wissenschaft.de (Almanca)", "https://wissenschaft.de/artikel/hunde-erschnueffeln-invasive-pflanzen"]]},
 {"id": "gambiya", "bolum": "dunya", "konu": "Siyaset", "sure": 3, "seviye": "10+", "dosya": "meclis", "tarih": "23 Kasım 2026", "yer": {"ad": "Banjul, Gambiya", "lat": 13.45, "lon": -16.58}, "baslik": "Gambiya 5 Aralık'ta sandık başına gidiyor: Bir lider kaç kez aday olabilir?", "ozet": "Batı Afrika ülkesi Gambiya'da seçim kurulu, devlet başkanlığı seçimi için dokuz adayı onayladı. Görevdeki Devlet Başkanı Adama Barrow üçüncü kez aday oluyor.", "neOldu": ["Gambiya Bağımsız Seçim Komisyonu, 5 Aralık'taki seçim için aday listesini Kasım ortasında kesinleştirdi. Seçim kampanyası 16 Kasım'da başladı ve 3 Aralık'a kadar sürecek.", "Gambiya'nın 1997'de kabul edilen anayasası, bir kişinin kaç kez devlet başkanı seçilebileceğine sınır koymuyor. Bu sınırı da içeren yeni bir anayasa hazırlamak için 2020'de ve 2024'te iki deneme yapıldı ama ikisi de sonuçsuz kaldı. Bu yüzden Barrow'un yeniden aday olması kurallara uygun."], "neden": "Birçok ülke, bir liderin en fazla kaç kez seçilebileceğini anayasasında belirliyor. Bu kural olup olmadığı ve nasıl yazıldığı, bir ülkede yönetimin nasıl el değiştirdiğini doğrudan etkiliyor.", "taraflar": "Barrow'un adaylığını destekleyenler, anayasanın buna izin verdiğini ve son kararı seçmenlerin sandıkta vereceğini söylüyor. Onlara göre ülkenin istikrarı için tecrübeli bir yönetim önemli. Adaylığı eleştirenler ise Barrow'un ilk seçildiğinde yeniden aday olmayacağını söylediğini hatırlatıyor. Onlara göre görev süresine bir sınır konmalı ve yönetim düzenli olarak değişmeli.", "bizeNe": "Seçimlerin nasıl yapılacağı ve bir kişinin kaç kez aday olabileceği her ülkede anayasada yazıyor. Türkiye'de de bu kurallar Anayasa'da yer alıyor; ülkeler bu konuyu farklı biçimlerde düzenliyor.", "kelimeler": ["gambiya", "anayasa"], "soru": "Sınıf başkanı seçerken bir öğrencinin kaç kez aday olabileceğine dair bir kural olmalı mı? Neden?", "kaynaklar": [["Reuters (TimesLIVE), 16 Kasım 2026", "https://www.timeslive.co.za/news/africa/2026-11-16-gambia-clears-barrow-to-run-for-third-presidential-term-approves-eight-other-candidates/"], ["Africanews, 12 Kasım 2026", "https://www.africanews.com/2026/11/12/the-gambias-electoral-commission-announces-5-candidates-for-presidential-poll/"], ["Africa Center: Gambiya seçimleri", "https://africacenter.org/spotlight/en-elections-2026/gambia/"]]},
 {"id": "gergedan", "bolum": "dunya", "konu": "Doğa", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "23 Kasım 2026", "yer": {"ad": "Chester Hayvanat Bahçesi, İngiltere", "lat": 53.23, "lon": -2.88}, "baslik": "Tek boynuzlu gergedan yavrusu ilk adımlarını attı", "ozet": "İngiltere'deki Chester Hayvanat Bahçesi'nde nadir görülen büyük tek boynuzlu gergedan türünden bir yavru dünyaya geldi.", "neOldu": ["Yavru 11 Kasım'da doğdu. Annesi Asha'nın hamileliği yaklaşık 15 ay sürdü. Doğum, bahçedeki güvenlik kameralarıyla kaydedildi.", "Bakıcılar hem annenin hem de yavrunun sağlıklı olduğunu söylüyor. Yavru kısa süre içinde ilk adımlarını attı. Yavrunun dişi mi erkek mi olduğu henüz açıklanmadı."], "neden": "Büyük tek boynuzlu gergedan, bir zamanlar yok olmanın eşiğine gelmiş bir tür. Bu doğum, türü korumak için hayvanat bahçelerinin birlikte yürüttüğü üretme programı için önemli bir adım.", "bizeNe": "Türkiye'de de nesli tehlikedeki türler için üretme çalışmaları yapılıyor. Örneğin Şanlıurfa'nın Birecik ilçesinde kelaynak kuşları bu tür bir programla korunuyor.", "kelimeler": ["gergedan", "birlesikkrallik"], "soru": "Yeni doğan gergedan yavrusuna bir isim verecek olsan ne koyardın?", "kaynaklar": [["WBAL-TV", "https://www.wbaltv.com/article/greater-one-horned-rhino-born-chester-zoo/74491463"], ["Brit Brief", "https://britbrief.co.uk/environment/conservation/rare-baby-rhino-born-at-chester-zoo-in-species-boost.html"], ["Newsbug", "https://www.newsbug.info/news/nation/rare-baby-rhino-takes-first-steps-at-zoo/article_d141cb58-f310-5240-b9e8-4ac322bb1e2f.html"]]},
 {"id": "lgs2027", "bolum": "turkiye", "konu": "Okul", "sure": 2, "seviye": "10+", "dosya": null, "tarih": "23 Kasım 2026", "baslik": "8. sınıflar için takvim belli: LGS 13 Haziran 2027'de", "ozet": "Liselere Geçiş Sistemi kapsamındaki merkezi sınav 13 Haziran 2027 Pazar günü yapılacak. Başvuru tarihleri ise henüz açıklanmadı.", "neOldu": ["Milli Eğitim Bakanlığı'nın 2027 yılı sınav takvimine göre LGS, 13 Haziran 2027 Pazar günü kâğıt üzerinde yapılacak. Sınava 8. sınıf öğrencileri girecek.", "Başvuruların ne zaman alınacağı ve sonuçların ne zaman açıklanacağı, sınav kılavuzu yayımlandığında belli olacak. 2026-2027 eğitim yılı ise 25 Haziran 2027 Cuma günü sona erecek."], "neden": "LGS, öğrencilerin hangi liselere yerleşeceğini belirleyen sınav. Tarihi erkenden bilmek, öğrencilerin ve ailelerin yılı planlamasına yardım ediyor.", "kelimeler": ["lgs", "meb"], "soru": "Önemli bir sınava ya da yarışmaya hazırlanırken stresini azaltmak için neler yaparsın?", "kaynaklar": [["Takvim", "https://www.takvim.com.tr/egitim/2027-lgs-sinav-tarihi-belli-oldu-6543804"], ["Timeturk", "https://www.timeturk.com/2027-lgs-tarihi-belli-oldu-13-haziranda-yapilacak"], ["Eğitimsistem", "https://www.egitimsistem.com/meb-duyurdu-lgs-kapsamindaki-merkezi-sinav-13-haziranda-yapilacak-115468h.htm"]]},
 {"id": "gpstasma", "bolum": "dunya", "konu": "Bilim", "sure": 2, "seviye": "10+", "dosya": null, "tarih": "23 Kasım 2026", "yer": {"ad": "Ås, Norveç", "lat": 59.66, "lon": 10.78}, "baslik": "Hayvanları yakalamadan izlemek: Takip tasmasını kendileri takıyor", "ozet": "Norveçli bilim insanları, yabani hayvanların GPS tasmalarını yakalanmadan, kendi kendilerine takmalarını sağlayan bir yöntem geliştirdi.", "neOldu": ["Bilim insanları hayvanların nerede dolaştığını öğrenmek için onlara GPS'li tasmalar takıyor. Ama bunun için hayvanı önce yakalamak, çoğu zaman da uyutmak gerekiyor. Norveç Yaşam Bilimleri Üniversitesi'nden (NMBU) Profesör Richard Bischof ve ekibi bunu değiştirmek istiyor.", "Ekibin yönteminde, doğaya içinde yem bulunan özel düzenekler yerleştiriliyor. Hayvan yeme ulaşmak için düzeneğe yaklaştığında tasma kendiliğinden boynuna takılıyor. Yöntem şimdiye kadar bir toynaklı ve bir etçil hayvan türünde denendi. Çalışma BioScience dergisinde anlatıldı."], "neden": "Yakalanmak hayvanlar için korkutucu ve yorucu bir deneyim; davranışlarını ve sağlıklarını etkileyebiliyor. Hayvanları yakalamadan izleyebilmek hem onlar için daha iyi hem de toplanan bilgilerin daha doğru olmasını sağlayabilir.", "sinir": "Bu henüz bir ilk deneme. Yöntem az sayıda türde test edildi ve hayvanların davranışını eski yöntemlere göre ne kadar az etkilediği hâlâ karşılaştırılıyor.", "bizeNe": "Türkiye'de de kurt, ayı ve yaban keçisi gibi hayvanların nerede dolaştığını anlamak için GPS'li tasmalar kullanılıyor. Bu yöntem gelişirse burada da işe yarayabilir.", "kelimeler": ["gps", "norvec"], "soru": "Bir hayvanın bir hafta boyunca nereye gittiğini izleyebilseydin, hangi hayvanı seçerdin?", "kaynaklar": [["EurekAlert (NMBU)", "https://www.eurekalert.org/news-releases/1150199"], ["AGI (İtalyanca), 4 Kasım 2026", "https://www.agi.it/estero/news/2026-11-04/animali-collari-gps-39883896/"]]},
 {"id": "turuncubalik", "bolum": "dunya", "konu": "Doğa", "sure": 2, "seviye": "8+", "dosya": null, "tarih": "23 Kasım 2026", "yer": {"ad": "Amapá, Brezilya", "lat": -0.83, "lon": -52.52}, "baslik": "Amazon'da turuncu benekli yeni bir balık bulundu, ama yaşadığı yer tehlikede", "ozet": "Brezilya'daki Amazon ormanlarında, parmak boyundan bile küçük, turuncu desenli yeni bir balık türü tanımlandı. Araştırmacılar bu balığın şimdiden tehlike altında olduğunu söylüyor.", "neOldu": ["Balığa Laimosemion laranja adı verildi. \"Laranja\" Portekizcede hem turuncu rengi hem de portakalı anlatıyor. Erkeklerin vücudunun ön kısmında turuncu benekler, kuyruğa yakın yerde ise turuncu çizgiler var. Ölçülen en büyük erkek yaklaşık 2,8 santimetreydi.", "Brezilyalı araştırmacılar balığın vücut ölçülerini, pullarını, iskeletini ve DNA'sını inceledi. DNA'sının en yakın akrabalarından yüzde 5,3 farklı olduğunu buldular. Balık şimdilik yalnızca Amapá eyaletindeki üç küçük orman göletinden biliniyor. Araştırma Zoosystematics and Evolution dergisinde yayımlandı."], "neden": "Balığın yaşadığı göletler orman kesimi, şehirlerin büyümesi ve madencilik yüzünden zarar görüyor. Araştırmacılar türün \"tehlikede\" sayılmasını ve yakındaki koruma alanının sınırlarının genişletilmesini öneriyor.", "sinir": "Balık yalnızca üç gölette görüldü. Başka yerlerde de yaşayıp yaşamadığı ve kaç tane olduğu henüz bilinmiyor. Tehlike sınıfı da şimdilik araştırmacıların önerisi; resmi bir karar değil.", "bizeNe": "Türkiye'de de yalnızca tek bir gölde ya da derede yaşayan balık türleri var. Örneğin Van Gölü'ndeki inci kefali dünyada başka hiçbir yerde yaşamıyor.", "kelimeler": ["brezilya", "amazon"], "soru": "Çok küçük bir alanda yaşayan bir canlıyı korumak için sen olsan neler yapardın?", "kaynaklar": [["EurekAlert", "https://www.eurekalert.org/news-releases/1144586"], ["SciTechDaily", "https://scitechdaily.com/scientists-discover-striking-orange-killifish-in-the-amazons-threatened-forest-pools/"], ["Nautilus", "https://nautil.us/a-striking-new-fish-species-discovered-in-amazon-1285318/"]]},
 {"id": "ucluzirve", "bolum": "dunya", "konu": "Siyaset", "sure": 3, "seviye": "10+", "dosya": null, "tarih": "22 Kasım 2026", "yer": {"ad": "Shenzhen, Çin", "lat": 22.54, "lon": 114.06}, "baslik": "ABD, Çin ve Rusya liderleri ilk kez üçlü masada: Konu nükleer silahlar", "ozet": "ABD, Çin ve Rusya'nın liderleri 19 Kasım'da Çin'in Shenzhen kentinde ilk kez üçü bir arada görüştü. Nükleer riskleri azaltmak için konuşmaya devam etme sözü verdiler ama somut bir anlaşma çıkmadı.", "neOldu": ["Görüşme, Asya ve Pasifik ülkelerinin ekonomi toplantısı APEC sırasında yapıldı. ABD Başkanı Donald Trump, Çin Devlet Başkanı Şi Cinping ve Rusya Devlet Başkanı Vladimir Putin ilk kez üçlü bir toplantıda bir araya geldi. Dünyadaki nükleer silahların büyük bölümü bu üç ülkenin elinde.", "Toplantının ardından ortak bir bildiri yayımlandı. Liderler, nükleer silahların başka ülkelere yayılmasını önlemek ve nükleer riskleri azaltmak için görüşmeler yapacaklarını açıkladı. Bildiride Birleşmiş Milletler'de reform yapılması ve petrol ürünlerinin düzenli akması gibi konular da yer aldı.", "Ancak silahların sayısı ya da nasıl denetleneceği gibi konularda bir anlaşma yapılmadı. ABD ile Rusya arasındaki son büyük nükleer silah anlaşması olan New START, bu yılın şubat ayında sona ermişti."], "neden": "Nükleer silahlar çok güçlü ve tehlikeli silahlar. Ülkeler onların sayısını sınırlamak ve kazara kullanılmalarını önlemek için yıllardır anlaşmalar yapıyor. Bu tür görüşmeler, dünyanın daha güvenli olması için atılan adımların bir parçası.", "taraflar": "Beyaz Saray'ın açıklamasına göre üç lider, nükleer bir savaşın kazanılamayacağını ve asla yapılmaması gerektiğini yeniden vurguladı. Çin Devlet Başkanı Şi, toplantıdan önce nükleer silahların tamamen yasaklanıp yok edilmesi gerektiğini söyledi ve görüşmeyi olumlu buldu. Rusya Devlet Başkanı Putin ise üçlü toplantıyı yararlı ve içerikli olarak nitelendirdi. Silah kontrolü üzerine çalışan bazı uzmanlar, tek bir toplantıdan büyük bir sonuç beklenmemesi g
