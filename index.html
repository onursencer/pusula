/* helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bolumAd = b => b === "turkiye" ? "Türkiye" : "Dünya";
const chip = b => `<span class="chip ${b}">${bolumAd(b)}</span>`;
const fmt = n => n.toLocaleString("tr-TR");

function mesafe(a, b){
  const R = 6371, r = x => x*Math.PI/180;
  const dLat = r(b.lat-a.lat), dLon = r(b.lon-a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function yon(a, b){
  const r = x => x*Math.PI/180;
  const y = Math.sin(r(b.lon-a.lon))*Math.cos(r(b.lat));
  const x = Math.cos(r(a.lat))*Math.sin(r(b.lat)) - Math.sin(r(a.lat))*Math.cos(r(b.lat))*Math.cos(r(b.lon-a.lon));
  return (Math.atan2(y,x)*180/Math.PI + 360) % 360;
}

/* metindeki kavramları bul ve bağla */
const KALIP = [];
for(const [id,c] of Object.entries(KAVRAM)) for(const k of c.k) KALIP.push({id,k,re:new RegExp("(?<![\\p{L}\\d])"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[\\p{L}'’]*","gu")});
KALIP.sort((a,b)=>b.k.length-a.k.length);
function bul(text){
  const hits=[];
  for(const p of KALIP){ p.re.lastIndex=0; let m; while((m=p.re.exec(text))){ if(KAVRAM[p.id].haric && KAVRAM[p.id].haric.test(m[0])) continue; hits.push({i:m.index,j:m.index+m[0].length,id:p.id,len:p.k.length}); } }
  hits.sort((a,b)=>a.i-b.i||b.len-a.len);
  const out=[]; let end=-1; for(const h of hits){ if(h.i>=end){ out.push(h); end=h.j; } }
  return out;
}
function bagla(text, used){
  const hs=bul(text); let html="", pos=0;
  for(const h of hs){
    html+=esc(text.slice(pos,h.i));
    const w=text.slice(h.i,h.j);
    if(used && used.has(h.id)) html+=esc(w);
    else { html+=`<button type="button" class="k" data-k="${h.id}" aria-haspopup="dialog">${esc(w)}</button>`; used&&used.add(h.id); }
    pos=h.j;
  }
  return html+esc(text.slice(pos));
}
const metin = h => [h.baslik,h.ozet,...h.neOldu,h.neden,h.sinir||"",h.taraflar||"",h.bizeNe||""].join(" ");
const IDX = {}; for(const h of HABERLER){ IDX[h.id]=new Set([...bul(metin(h)).map(x=>x.id), ...h.kelimeler]); }
const gecen = id => HABERLER.filter(h=>IDX[h.id].has(id));
const YONLER = ["kuzey","kuzeydoğu","doğu","güneydoğu","güney","güneybatı","batı","kuzeybatı"];

function item(h){
  return `<a class="item ${h.bolum}" href="#h-${h.id}"><span class="stripe" aria-hidden="true"></span><div>
    <div class="meta">${chip(h.bolum)}<span>${esc(h.konu)}</span><span>${h.sure} dk</span></div>
    <h3>${esc(h.baslik)}</h3><p>${esc(h.ozet)}</p></div></a>`;
}

/* views */
function vAna(){
  const lead = HABERLER[0];
  const rest = HABERLER.filter(h => h !== lead);
  return `<p class="proto">Haberler ${GUNCELLEME} gündeminden derlendi.</p>
  <section class="home">
    <a class="lead" href="#h-${lead.id}">
      <svg class="rose" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2"/><path d="M50 4 L58 50 L50 96 L42 50Z M4 50 L50 42 L96 50 L50 58Z" fill="currentColor"/></svg>
      <span class="eyebrow">Günün haberi · ${bolumAd(lead.bolum)}</span>
      <h1>${esc(lead.baslik)}</h1>
      <p>${esc(lead.ozet)}</p>
      <span class="go">Haberi oku · ${lead.sure} dk</span>
    </a>
    <div class="side">
      <h2>Son haberler</h2>
      <div class="feed">${rest.slice(0,4).map(item).join("")}</div>
    </div>
  </section>
  <section class="row">
    <h2 class="sec-title">Dosyalar <small>Uzun soluklu konular, her haberle büyüyor</small></h2>
    <div class="grid3">${DOSYALAR.slice(0,3).map(dosyaKart).join("")}</div>
  </section>
  <section class="row strip">
    <a class="qbox" href="#quiz"><span class="chip konu" style="color:inherit">Haftanın Quizi</span><h3>Bu haftanın haberlerini ne kadar takip ettin?</h3><p>${QUIZ.length} soru · ${Math.max(1,Math.round(QUIZ.length*0.4))} dakika</p></a>
    <a class="qbox alt" href="#sozluk"><span class="chip konu">Sözlük</span><h3>Haberlerde geçen ${Object.keys(KAVRAM).length} kavram tek yerde</h3><p style="color:var(--muted)">Ülkeler, şehirler, kurumlar ve zor kelimeler. Her yeni haberle büyüyor.</p></a>
  </section>`;
}
function dosyaKart(d){
  const n = HABERLER.filter(h => h.dosya === d.id).length;
  return `<a class="card" href="#d-${d.id}"><h3>${esc(d.ad)}</h3><p>${esc(d.acik)}</p><span class="count">${n ? n+" haber" : "Yakında"}</span></a>`;
}
function vBolum(b){
  const list = HABERLER.filter(h => h.bolum === b);
  const intro = b === "turkiye" ? "Türkiye'de olup bitenler, senin anlayacağın dille." : "Dünyanın dört bir yanından haberler. Her birinde bunun bizimle ilgisini de anlatıyoruz.";
  return `<h1 class="page-h">${bolumAd(b)}</h1><p class="intro">${intro}</p><div class="feed" style="max-width:760px">${list.map(item).join("")}</div>`;
}
function vHaber(id){
  const h = HABERLER.find(x => x.id === id);
  if(!h) return vAna();
  const used = new Set();
  let where = "";
  if(h.yer){
    const km = Math.round(mesafe(IST, h.yer)/10)*10;
    const deg = yon(IST, h.yer);
    const ad = YONLER[Math.round(deg/45)%8];
    const saat = km/850;
    const sure = saat < 1.5 ? "yaklaşık 1 saat" : `yaklaşık ${Math.round(saat)} saat`;
    where = `<div class="where"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="var(--world-soft)" stroke="var(--world)" stroke-width="2"/><g transform="rotate(${deg.toFixed(0)} 32 32)"><path d="M32 8 L37 32 L27 32Z" fill="var(--world)"/><path d="M32 56 L37 32 L27 32Z" fill="var(--line)"/></g><circle cx="32" cy="32" r="3" fill="var(--ink)"/></svg>
      <div><b>${esc(h.yer.ad)}</b><div class="nums">İstanbul'un ${ad}sunda, ${fmt(km)} km uzakta. Uçakla ${sure}.</div></div></div>`;
  }
  return `<article class="article">
    <a class="back" href="#${h.bolum}">← ${bolumAd(h.bolum)}</a>
    <div class="meta">${chip(h.bolum)}<span>${esc(h.konu)}</span><span>${h.sure} dk okuma</span><span>Seviye ${h.seviye}</span></div>
    <h1>${esc(h.baslik)}</h1>
    <p class="ozet">${bagla(h.ozet,used)}</p>
    ${where}
    <p class="tip">Altı noktalı kelimelere dokun, ne olduklarını öğren.</p>
    <section class="block"><h2>Ne oldu?</h2>${h.neOldu.map(p=>`<p>${bagla(p,used)}</p>`).join("")}</section>
    <section class="box why block"><h2>Neden önemli?</h2><p>${bagla(h.neden,used)}</p></section>
    ${h.sinir ? `<section class="box limit block"><h2>Bu araştırma neyi kanıtlamıyor?</h2><p>${bagla(h.sinir,used)}</p></section>` : ""}
    ${h.taraflar ? `<section class="block"><h2>Kim ne diyor?</h2><p>${bagla(h.taraflar,used)}</p></section>` : ""}
    ${h.bizeNe ? `<section class="box us block"><h2>Bunun bizimle ne ilgisi var?</h2><p>${bagla(h.bizeNe,used)}</p></section>` : ""}
    <section class="block"><h2>Bu haberdeki kavramlar</h2><div class="words">${[...IDX[h.id]].map(k=>`<button type="button" class="word k" data-k="${k}">${esc(KAVRAM[k].ad)}</button>`).join("")}</div></section>
    <section class="box ask block"><h2>Sen ne düşünüyorsun?</h2><p>${esc(h.soru)}</p></section>
    <p class="src">${esc(h.tarih)} · Kaynaklar: ${h.kaynaklar.map(k=>`<a href="${esc(k[1])}" target="_blank" rel="noopener">${esc(k[0])}</a>`).join(", ")}. Bu haber kaynaklardan derlenip yapay zekâ yardımıyla yeniden yazıldı.</p>
  </article>`;
}
function vDosyalar(){
  return `<h1 class="page-h">Dosyalar</h1><p class="intro">Bazı konular tek bir haberle anlaşılmaz. Dosyalarda bir konuyla ilgili bütün haberleri, temel bilgileri ve sözlüğü bir arada bulursun.</p><div class="grid3">${DOSYALAR.map(dosyaKart).join("")}</div>`;
}
function vDosya(id){
  const d = DOSYALAR.find(x => x.id === id); if(!d) return vDosyalar();
  const list = HABERLER.filter(h => h.dosya === id);
  return `<a class="back" href="#dosyalar">← Dosyalar</a><h1 class="page-h" style="margin-top:var(--s3)">${esc(d.ad)}</h1><p class="intro">${esc(d.acik)}</p>
    ${list.length ? `<div class="feed" style="max-width:760px">${list.map(item).join("")}</div>` : `<p class="proto">Bu dosyaya ilk haber yakında eklenecek.</p>`}`;
}
function vSozluk(){
  const keys = Object.keys(KAVRAM).sort((a,b)=>KAVRAM[a].ad.localeCompare(KAVRAM[b].ad,"tr"));
  return `<h1 class="page-h">Sözlük</h1><p class="intro">Haberlerde geçen ülkeler, şehirler, kurumlar ve zor kelimeler. Her yeni haberle sözlüğümüz büyüyor.</p>
  <label for="sozara" style="position:absolute;left:-9999px">Sözlükte ara</label>
  <input id="sozara" class="search" type="search" placeholder="Sözlükte ara, örneğin Senato">
  <div class="terms" id="terms">${keys.map(k=>{
    const c=KAVRAM[k], r=gecen(k);
    return `<div class="term" id="s-${k}" data-q="${esc((c.ad+" "+c.tur+" "+c.m).toLocaleLowerCase("tr"))}"><span class="tur">${esc(c.tur)}</span><h3><button type="button" class="k" data-k="${k}">${esc(c.ad)}</button></h3><p>${esc(c.m)}</p>${r.length?`<p class="rel">Geçtiği haber: ${r.map(h=>`<a href="#h-${h.id}">${esc(h.baslik)}</a>`).join(" · ")}</p>`:""}</div>`;
  }).join("")}</div>`;
}
let aramaQ = "";
function vAra(){
  const q = aramaQ.trim().toLocaleLowerCase("tr");
  if(!q) return `<h1 class="page-h">Pusula'da ara</h1><p class="intro">Bir ülke, şehir, kurum, kavram ya da haber ara. Örneğin "Kongre", "Antalya" ya da "meteor".</p>`;
  const kv = Object.entries(KAVRAM).filter(([id,c])=>(c.ad+" "+c.k.join(" ")+" "+c.m).toLocaleLowerCase("tr").includes(q));
  const hb = HABERLER.filter(h=>metin(h).toLocaleLowerCase("tr").includes(q));
  return `<h1 class="page-h">"${esc(aramaQ.trim())}" için sonuçlar</h1>
  <div class="res">
  ${kv.length?`<h2>Sözlükte</h2><div class="feed" style="max-width:760px">${kv.map(([id,c])=>`<button type="button" class="hit k" data-k="${id}"><small>${esc(c.tur)}</small><b>${esc(c.ad)}</b><span>${esc(c.m)}</span></button>`).join("")}</div>`:""}
  ${hb.length?`<h2>Haberlerde</h2><div class="feed" style="max-width:760px">${hb.map(item).join("")}</div>`:""}
  ${!kv.length&&!hb.length?`<p class="intro">Bununla ilgili bir şey bulamadık. Başka bir kelime dene.</p>`:""}
  </div>`;
}
let qi = 0, qres = [];
function vQuiz(){
  if(qi >= QUIZ.length){
    const d = qres.filter(Boolean).length;
    const msg = d === QUIZ.length ? "Haberleri çok iyi takip ediyorsun!" : d >= 3 ? "Güzel! Birkaç haberi kaçırmışsın, okumak ister misin?" : "Bu haftanın haberlerine göz atınca bir daha dene.";
    return `<div class="quiz"><h1 class="page-h">Haftanın Quizi</h1>${bar()}<div class="qcard"><span class="score">${d}/${QUIZ.length}</span><p>${msg}</p><button class="btn" id="tekrar" type="button">Yeniden başla</button></div></div>`;
  }
  const q = QUIZ[qi];
  return `<div class="quiz"><h1 class="page-h">Haftanın Quizi</h1>${bar()}
    <div class="qcard"><span class="meta">Soru ${qi+1} / ${QUIZ.length}</span><h2>${esc(q.s)}</h2>
    ${q.o.map((o,i)=>`<button class="opt" type="button" data-i="${i}">${esc(o)}</button>`).join("")}
    <p class="expl" id="expl" hidden></p><button class="btn" id="sonraki" type="button" hidden>${qi===QUIZ.length-1?"Sonucu gör":"Sonraki soru"}</button></div></div>`;
}
function bar(){ return `<div class="progress" aria-hidden="true">${QUIZ.map((_,i)=>`<i class="${i<qres.length?(qres[i]?"ok":"no"):(i===qi?"now":"")}"></i>`).join("")}</div>`; }
function vIlkeler(){
  return `<h1 class="page-h">Yayın ilkelerimiz</h1><p class="intro">Pusula'da her haber bu sözlere göre yazılır. Veliler ve öğretmenler neyi neden yaptığımızı buradan görebilir.</p>
  <div class="rules">${ILKELER.map(r=>`<div class="rule"><div><h3>${esc(r[0])}</h3><p>${esc(r[1])}</p></div></div>`).join("")}</div>`;
}

/* router */
function render(){
  const hash = (location.hash || "#ana").slice(1);
  let html, cur = hash;
  if(hash.startsWith("h-")){ const h = HABERLER.find(x=>x.id===hash.slice(2)); html = vHaber(hash.slice(2)); cur = h ? h.bolum : "ana"; }
  else if(hash.startsWith("d-")){ html = vDosya(hash.slice(2)); cur = "dosyalar"; }
  else if(hash.startsWith("s-")){ html = vSozluk(); cur = "sozluk"; }
  else if(hash==="ara"){ html = vAra(); cur = ""; }
  else html = ({turkiye:()=>vBolum("turkiye"),dunya:()=>vBolum("dunya"),dosyalar:vDosyalar,sozluk:vSozluk,quiz:vQuiz,ilkeler:vIlkeler,ara:vAra}[hash] || vAna)();
  kartKapat();
  $("#view").innerHTML = html;
  $("#nav").innerHTML = NAV.map(([k,v])=>`<li><a href="#${k}" ${k===cur?'aria-current="page"':""}>${v}</a></li>`).join("");
  if(hash.startsWith("s-")){ const t = document.getElementById(hash); if(t){ t.scrollIntoView({block:"center"}); return; } }
  window.scrollTo(0,0);
}

document.addEventListener("click", e => {
  const o = e.target.closest(".opt");
  if(o && !o.disabled){
    const q = QUIZ[qi], i = +o.dataset.i, ok = i === q.d;
    document.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled = true; if(j===q.d) b.classList.add("right"); });
    if(!ok) o.classList.add("wrong");
    qres.push(ok);
    const ex = $("#expl"); ex.textContent = (ok ? "Doğru! " : "Olmadı. ") + q.a; ex.hidden = false;
    $("#sonraki").hidden = false; $("#sonraki").focus();
    return;
  }
  if(e.target.id === "sonraki"){ qi++; render(); }
  if(e.target.id === "tekrar"){ qi = 0; qres = []; render(); }
});
document.addEventListener("input", e => {
  if(e.target.id === "sozara"){
    const v = e.target.value.trim().toLocaleLowerCase("tr");
    document.querySelectorAll(".term").forEach(t => t.hidden = v && !t.dataset.q.includes(v));
  }
});


$("#today").textContent = new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

/* kavram kartı */
let harita = null, sonOdak = null;
function kartAc(id, from){
  const c = KAVRAM[id]; if(!c) return;
  sonOdak = from || document.activeElement;
  const r = gecen(id);
  const k = $("#kart");
  k.innerHTML = `<div class="top"><div><span class="tur">${esc(c.tur)}</span><h2 id="kart-h">${esc(c.ad)}</h2></div><button type="button" class="x" aria-label="Kartı kapat">×</button></div>
    <p>${esc(c.m)}</p>
    ${c.b?`<dl>${c.b.map(([a,v])=>`<dt>${esc(a)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`:""}
    ${c.map && window.jsVectorMap ? `<div class="map" id="harita" aria-label="${esc(c.ad)} haritada"></div>`:""}
    ${r.length?`<p class="rel">Geçtiği haberler: ${r.map(h=>`<a href="#h-${h.id}">${esc(h.baslik)}</a>`).join(" · ")}</p>`:""}
    <a class="more" href="#s-${id}">Sözlükte gör</a>`;
  k.hidden = false;
  if(harita){ try{ harita.destroy(); }catch(e){} harita = null; }
  if(c.map && window.jsVectorMap){
    try{
      harita = new jsVectorMap({
        selector:"#harita", map:"world", zoomButtons:false, zoomOnScroll:false, draggable:false, zoomOnScrollSpeed:0,
        backgroundColor:"transparent",
        regionStyle:{initial:{fill:"#B9E0DC",stroke:"#FFFFFF",strokeWidth:.4,fillOpacity:1},hover:{fillOpacity:1,cursor:"default"},selected:{fill:"#08858A"}},
        selectedRegions: c.map.r ? [c.map.r] : [],
        regionsSelectable:false,
        markers:[{name:c.ad, coords:[c.map.lat,c.map.lon]}],
        markerStyle:{initial:{fill:"#FFC93C",stroke:"#0F2A2E",strokeWidth:2,r:6},hover:{cursor:"default"}},
        showTooltip:false
      });
    }catch(e){ const m=$("#harita"); if(m) m.remove(); }
  }
  k.querySelector(".x").focus();
}
function kartKapat(){
  const k = $("#kart"); if(!k || k.hidden) return;
  k.hidden = true;
  if(harita){ try{ harita.destroy(); }catch(e){} harita = null; }
  if(sonOdak && document.contains(sonOdak)) sonOdak.focus();
}
document.addEventListener("click", e => {
  const t = e.target.closest(".k");
  if(t){ e.preventDefault(); kartAc(t.dataset.k, t); return; }
  if(e.target.closest("#kart .x")){ kartKapat(); return; }
  const k = $("#kart");
  if(!k.hidden && !e.target.closest("#kart")) kartKapat();
});
document.addEventListener("keydown", e => { if(e.key === "Escape") kartKapat(); });
$("#q").addEventListener("input", e => {
  aramaQ = e.target.value;
  if(location.hash !== "#ara") location.hash = "ara"; else $("#view").innerHTML = vAra();
});

window.addEventListener("hashchange", render);
render();
</script>

</body></html>
